    </div>
    <button class="pwa-install-btn" id="pwa-install-btn">安装</button>
    <button class="pwa-install-close" onclick="dismissPwaBanner()">✕</button>
</div>

<!-- PWA 启动画面 -->
<div class="pwa-splash" id="pwa-splash">
    <div class="pwa-splash-icon">🚀</div>
    <div class="pwa-splash-text">星际学堂 V10.2</div>
    <div class="pwa-splash-spinner"></div>
</div>

<script>
// ==================== V10.2 PWA ====================
let deferredPrompt = null;

// Service Worker 注册
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
                console.log('[PWA] SW registered:', reg.scope);
                // 检查更新
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // 有新版本，提示用户刷新
                            showUpdateToast();
                        }
                    });
                });
            })
            .catch(err => console.error('[PWA] SW registration failed:', err));
    });
}

// 捕获安装提示事件
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showPwaInstallBanner();
});

// 监听安装完成
window.addEventListener('appinstalled', (evt) => {
    console.log('[PWA] App installed');
    dismissPwaBanner();
    // 发送安装统计
    if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'INSTALLED' });
    }
});

function showPwaInstallBanner() {
    const banner = document.getElementById('pwa-install-banner');
    if (banner) {
        setTimeout(() => banner.classList.add('show'), 1000);
    }
}

function dismissPwaBanner() {
    const banner = document.getElementById('pwa-install-banner');
    if (banner) {
        banner.classList.remove('show');
        setTimeout(() => banner.style.display = 'none', 400);
    }
    // 7天后再次提醒
    localStorage.setItem('pwa_banner_dismissed', Date.now());
}

document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
    if (!deferredPrompt) {
        // iOS 不支持 beforeinstallprompt，显示手动引导
        showIosInstallGuide();
        return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
        console.log('[PWA] User accepted install');
    } else {
        console.log('[PWA] User dismissed install');
    }
    deferredPrompt = null;
    dismissPwaBanner();
});

// iOS 安装引导
function showIosInstallGuide() {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000';
    modal.innerHTML = `
        <div style="background:var(--glass-bg-strong);backdrop-filter:blur(20px);border-radius:24px;padding:28px;max-width:360px;width:90%;border:1px solid var(--glass-border);box-shadow:var(--shadow-float);text-align:center">
            <div style="font-size:2.5rem;margin-bottom:12px">📲</div>
            <h4 style="margin:0 0 16px;color:var(--text-primary)">添加到主屏幕</h4>
            <div style="text-align:left;color:var(--text-secondary);font-size:0.85rem;line-height:1.8">
                <p>1. 点击底部 <b style="color:var(--accent-orange)">分享</b> 按钮</p>
                <p>2. 选择 <b style="color:var(--accent-orange)">"添加到主屏幕"</b></p>
                <p>3. 点击 <b style="color:var(--accent-orange)">"添加"</b> 即可</p>
            </div>
            <button onclick="this.closest('[style*=fixed]').remove()" style="margin-top:20px;width:100%;padding:12px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent-orange),var(--gold));color:white;font-weight:600;cursor:pointer">知道了</button>
        </div>
    `;
    document.body.appendChild(modal);
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

// 更新提示
function showUpdateToast() {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--glass-bg-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:12px 24px;box-shadow:var(--shadow-float);z-index:10000;display:flex;align-items:center;gap:12px';
    toast.innerHTML = `
        <span style="color:var(--accent-orange);font-size:1.2rem">🔄</span>
        <span style="color:var(--text-primary);font-size:0.85rem">发现新版本</span>
        <button onclick="window.location.reload()" style="background:var(--accent-orange);color:white;border:none;border-radius:10px;padding:6px 16px;font-size:0.8rem;font-weight:600;cursor:pointer">立即更新</button>
    `;
    document.body.appendChild(toast);
}

// 启动画面控制
window.addEventListener('load', () => {
    const splash = document.getElementById('pwa-splash');
    if (splash) {
        setTimeout(() => {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 500);
        }, 800);
    }
    
    // 检查是否在 PWA 模式运行
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        console.log('[PWA] Running in standalone mode');
        document.body.classList.add('pwa-mode');
    }
});

// 检查是否已安装
function isPwaInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || 
           window.navigator.standalone === true;
}

// 离线状态检测
window.addEventListener('online', () => {
    console.log('[PWA] Back online');
    showNetworkToast(true);
});

window.addEventListener('offline', () => {
    console.log('[PWA] Offline mode');
    showNetworkToast(false);
});

function showNetworkToast(online) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:' + (online ? 'rgba(125,196,165,0.95)' : 'rgba(232,139,139,0.95)') + ';color:white;padding:10px 24px;border-radius:14px;font-size:0.85rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:10000;opacity:0;transition:opacity 0.3s';
    toast.textContent = online ? '✓ 网络已恢复' : '📴 当前离线，部分功能受限';
    document.body.appendChild(toast);
    setTimeout(() => toast.style.opacity = '1', 10);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

</script>
