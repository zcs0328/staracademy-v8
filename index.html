// ==================== 答题逻辑 ====================
function startQuiz(subject, level) {
    combo = 0;
    const levelData = Q[subject][level];
    quizState = {
        subject, level,
        questions: levelData.qs,
        index: 0,
        correct: 0,
        startTime: Date.now(),
        answers: [],
        matchState: null,
        isWrongPractice: false
    };
    document.getElementById('quiz-title').textContent = SUBJECT_INFO[subject].name + ' - 第' + (level + 1) + '关 ' + levelData.name;
    renderQuiz();
    document.getElementById('quiz-modal').classList.add('active');
}

function renderQuiz() {
    const q = quizState.questions[quizState.index];
    const type = q.t || 'choice';

    // 进度条
    const prog = document.getElementById('quiz-progress');
    prog.innerHTML = '';
    for (let i = 0; i < quizState.questions.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'quiz-dot';
        if (i < quizState.index) {
            dot.classList.add(quizState.answers[i] ? 'correct' : 'wrong');
        }
        if (i === quizState.index) dot.classList.add('current');
        prog.appendChild(dot);
    }

    // 题型标签
    const typeNames = { choice: '选择题', fill: '填空题', match: '连线配对', listen: '听音选词', tf: '判断对错' };
    document.getElementById('quiz-type-badge').textContent = '【' + (typeNames[type] || '选择题') + '】';

    // 题目
    document.getElementById('question-area').textContent = '第' + (quizState.index + 1) + '题：' + q.q;

    const opts = document.getElementById('answer-options');
    const footer = document.getElementById('quiz-footer');
    opts.innerHTML = '';
    footer.innerHTML = '';

    switch (type) {
        case 'choice':
            renderChoice(q, opts);
            break;
        case 'fill':
            renderFill(q, opts, footer);
            break;
        case 'match':
            renderMatch(q, opts);
            break;
        case 'listen':
            renderListen(q, opts);
            break;
        case 'tf':
            renderTF(q, opts);
            break;
        default:
            renderChoice(q, opts);
    }
}

function renderChoice(q, opts) {
    const correctText = q.o[q.a];
    const shuffled = fisherYatesShuffle(q.o);
    const newCorrectIdx = shuffled.indexOf(correctText);
    q._shuffled = shuffled;
    q._shuffledCorrect = newCorrectIdx;
    opts.style.display = 'grid';
    shuffled.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = opt;
        btn.onclick = () => handleChoice(idx === newCorrectIdx, q);
        opts.appendChild(btn);
    });
}

function handleChoice(correct, question) {
    const q = quizState.questions[quizState.index];
    const btns = document.querySelectorAll('.answer-options .answer-btn');
    btns.forEach(b => b.disabled = true);
    const correctIdx = q._shuffledCorrect;

    if (correct) {
        btns[correctIdx].classList.add('correct');
        btns[correctIdx].classList.add('correct-pulse');
        combo++;
        progress.xp += 10 + combo * 5;
        const oldLevel = progress.level;
        calculateLevel();
        if (progress.level > oldLevel) {
            showFireworks();
            setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
        }
        quizState.correct++;
        createRewardParticles(10);
        if (combo > 1) {
            showCombo(combo);
        }
        playSound('correct');
    } else {
        btns[correctIdx].classList.add('correct');
        btns.forEach((b, i) => { if (i !== correctIdx) b.classList.add('wrong'); });
        btns[btns.length - 1].classList.add('wrong-shake');
        if (combo >= 5) {
            showReward('连击中断');
        }
        combo = 0;
        playSound('wrong');
        // 记录错题
        const userAnswer = q._shuffled[btns.length - 1 - (btns.length - correctIdx)];
        addWrongQuestion(question, userAnswer);
    }

    quizState.answers.push(correct);
    progress.questionsAnswered++;
    if (correct) progress.correctAnswers++;
    setTimeout(nextQuestion, 1200);
}

function renderFill(q, opts, footer) {
    opts.style.display = 'block';
    opts.innerHTML = '<input type="text" class="fill-input" id="fill-answer" placeholder="请输入答案" autocomplete="off" />';
    footer.innerHTML = '<button class="submit-btn" onclick="handleFill()">提交答案</button>';

    setTimeout(() => {
        const inp = document.getElementById('fill-answer');
        if (inp) {
            inp.addEventListener('keydown', function(e) {

function handleFill() {
    const inp = document.getElementById('fill-answer');
    if (!inp) return;
    const userAnswer = inp.value.trim();
    if (!userAnswer) return;
    const q = quizState.questions[quizState.index];
    const correctAnswer = q.a;
    const isCorrect = userAnswer === correctAnswer ||
        userAnswer.toLowerCase() === correctAnswer.toLowerCase() ||
        userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');

    const submitBtn = document.querySelector('.submit-btn');
    if (submitBtn) submitBtn.disabled = true;
    inp.disabled = true;

    if (isCorrect) {
        inp.classList.add('correct');
        combo++;
        progress.xp += 10 + combo * 5;
        const oldLevel = progress.level;
        calculateLevel();
        if (progress.level > oldLevel) {
            showFireworks();
            setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
        }
        quizState.correct++;
        createRewardParticles(10);

        inp.classList.add('wrong');

        correctDiv.textContent = '正确答案：' + correctAnswer;

    progress.questionsAnswered++;
    if (isCorrect) progress.correctAnswers++;
    setTimeout(nextQuestion, 1500);
}

function renderMatch(q, opts) {
    opts.style.display = 'block';
    const pairs = q.pairs;
    const leftItems = fisherYatesShuffle(pairs.map(p => p[0]));
    const rightItems = fisherYatesShuffle(pairs.map(p => p[1]));

    quizState.matchState = {
        pairs: pairs,
        leftItems: leftItems,
        rightItems: rightItems,
        selectedLeft: null,
        selectedRight: null,
        matched: [],
        correctCount: 0
    };

    let html = '<div class="match-container">';
    html += '<div class="match-column" id="match-left">';
    leftItems.forEach((item, i) => {
        html += `<div class="match-item" data-side="left" data-idx="${i}" data-val="${item.replace(/'/g, "\\'")}" onclick="selectMatch('left',${i},'${item.replace(/'/g, "\\'")}')">${item}</div>`;
    });
    html += '</div>';
    html += '<div class="match-column" id="match-right">';
    rightItems.forEach((item, i) => {
        html += `<div class="match-item" data-side="right" data-idx="${i}" data-val="${item.replace(/'/g, "\\'")}" onclick="selectMatch('right',${i},'${item.replace(/'/g, "\\'")}')">${item}</div>`;
    });
    html += '</div></div>';
    opts.innerHTML = html;
}

function selectMatch(side, idx, val) {
    const ms = quizState.matchState;
    if (!ms) return;

    if (ms.matched.includes(val)) return;

    document.querySelectorAll('.match-item.selected').forEach(el => el.classList.remove('selected'));

    if (side === 'left') {
        ms.selectedLeft = { idx, val };
        document.querySelector(`#match-left .match-item[data-idx="${idx}"]`).classList.add('selected');
    } else {
        ms.selectedRight = { idx, val };
        document.querySelector(`#match-right .match-item[data-idx="${idx}"]`).classList.add('selected');
    }

    if (ms.selectedLeft && ms.selectedRight) {
        const leftVal = ms.selectedLeft.val;
        const rightVal = ms.selectedRight.val;
        const isCorrect = ms.pairs.some(p => p[0] === leftVal && p[1] === rightVal);

        const leftEl = document.querySelector(`#match-left .match-item[data-idx="${ms.selectedLeft.idx}"]`);
        const rightEl = document.querySelector(`#match-right .match-item[data-idx="${ms.selectedRight.idx}"]`);

        if (isCorrect) {
            leftEl.classList.add('matched');
            rightEl.classList.add('matched');
            leftEl.classList.remove('selected');
            rightEl.classList.remove('selected');
            ms.matched.push(leftVal, rightVal);
            ms.correctCount++;
            combo++;
            progress.xp += 10 + combo * 5;
            const oldLevel = progress.level;
            calculateLevel();
            if (progress.level > oldLevel) {
                showFireworks();
                setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
            }
            createRewardParticles(10);
            if (combo > 1) showCombo(combo);
            playSound('correct');
            showReward('配对正确！');

            if (ms.correctCount >= ms.pairs.length) {
                quizState.answers.push(true);
                quizState.correct++;
                progress.questionsAnswered++;
                progress.correctAnswers++;
                setTimeout(nextQuestion, 1000);
            }
        } else {
            leftEl.classList.add('wrong-flash');
            rightEl.classList.add('wrong-flash');
            setTimeout(() => {
                leftEl.classList.remove('wrong-flash', 'selected');
                rightEl.classList.remove('wrong-flash', 'selected');
            }, 400);
            if (combo >= 5) showReward('连击中断');
            combo = 0;
            playSound('wrong');
            addWrongQuestion(q, `${leftVal}-${rightVal}`);
        }
        ms.selectedLeft = null;
        ms.selectedRight = null;
    }
}

function handleTF(userAnswer, qIdx) {

function nextQuestion() {
    quizState.index++;
    if (quizState.index < quizState.questions.length) {
        renderQuiz();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    const { subject, level, correct, startTime } = quizState;
    const total = quizState.questions.length;
    let stars = 0;
    if (correct >= total * 0.9) stars = 3;
    else if (correct >= total * 0.7) stars = 2;
    else if (correct >= total * 0.5) stars = 1;
    else stars = 0;

    // XP奖励
    progress.xp += correct * 10;
    if (stars === 3 && !quizState.isWrongPractice) {
        progress.diamonds += 5;
    }
    // 通关XP奖励
    if (!quizState.isWrongPractice) {
        progress.xp += 50;
    }
    calculateLevel();

    const studyTime = Math.round((Date.now() - startTime) / 1000);
    progress.studyTime += studyTime;
    const today = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
    progress.dailyTimes[today] += studyTime;

    if (!quizState.isWrongPractice && !quizState.isDaily) {
        const lv = progress.subjects[subject].levels[level];
        if (stars > lv.stars) lv.stars = stars;
        if (stars > 0) lv.completed = true;
    }

    if (quizState.isWrongPractice) {
        // 从错题本移除答对的题
        quizState.questions.forEach((q, idx) => {
            if (quizState.answers[idx]) {
                // 找到这个题在错题本中的索引并移除
                const wrongList = progress.wrongBook[subject];
                const foundIndex = wrongList.findIndex(w => w.question === q.q && w.answer === q.a);
                if (foundIndex >= 0) {
                    wrongList.splice(foundIndex, 1);
                }
            }
        });
    }

    checkAchievements();

    // 每日挑战奖励逻辑
    if (quizState && quizState.isDaily) {
        const todayKey = 'dailyDone_' + quizState.dailyDate;
        progress[todayKey] = true;
        const dayIdx = new Date().getDay();
        progress.dailyTimes[dayIdx] = (progress.dailyTimes[dayIdx] || 0) + 1;
        progress.diamonds += 3;
        // 检查连续打卡
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayKey = 'dailyDone_' + yesterday.toISOString().slice(0, 10);
        if (progress[yesterdayKey]) {
            progress.dailyStreak = (progress.dailyStreak || 0) + 1;
        } else {
            progress.dailyStreak = 1;
        }
    }

    saveUserProgress();
    clearSavedQuiz();
    document.getElementById('quiz-modal').classList.remove('active');

    const starsDiv = document.getElementById('result-stars');
    starsDiv.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const s = document.createElement('div');
        s.className = 'result-star';
        if (i < stars) s.classList.add('earned');
        s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
        starsDiv.appendChild(s);
    }
    const msg = document.getElementById('result-message');
    if (stars === 3) {
        msg.textContent = '太厉害了！完美通关！';
        createRewardParticles(50);
        showFireworks();
    }
    else if (stars === 2) msg.textContent = '真棒！再加油！';
    else if (stars === 1) msg.textContent = '不错哦！继续努力！';
    else msg.textContent = '别灰心，再试一次吧！';

    const footer = document.getElementById('result-buttons');
    if (quizState.isDaily) {
        footer.innerHTML = '<button class="close-btn" onclick="closeResult()">返回</button>';
    } else {
        const isLastLevel = quizState.isWrongPractice ? false : level === 19;
        if (stars > 0 && !isLastLevel && !quizState.isWrongPractice) {
            footer.innerHTML = '<button class="next-btn" onclick="nextLevel()">下一关</button><button class="retry-btn" onclick="retryLevel()">再试一次</button>';
        } else if (stars > 0 && isLastLevel && !quizState.isWrongPractice) {
            footer.innerHTML = '<button class="close-btn" onclick="closeResult()">完成</button><button class="retry-btn" onclick="retryLevel()">再试一次</button>';
        } else {
            footer.innerHTML = '<button class="retry-btn" onclick="retryLevel()">再试一次</button><button class="close-btn" onclick="closeResult()">返回</button>';
        }
    }
    document.getElementById('result-modal').classList.add('active');
}

function nextLevel() {
    document.getElementById('result-modal').classList.remove('active');
    const nextLv = quizState.level + 1;
    if (nextLv < 20) {

function checkAchievements() {

    const check = (id) => {

            progress.achievements.push(id);
            createRewardParticles(20);
            setTimeout(() => {
                alert(`恭喜解锁成就：${ACHIEVEMENTS.find(a => a.id === id).name}`);
            }, 500);
        }
    };

    if (progress.correctAnswers >= 1) check('one_question');
    if (progress.correctAnswers >= 100) check('hundred_questions');
    if (progress.correctAnswers >= 1000) check('thousand_questions');
    if (progress.dailyStreak >= 7) check('seven_days');
    if (progress.dailyStreak >= 30) check('thirty_days');
    if (progress.totalStars >= 100) check('hundred_stars');
    if (progress.totalStars >= 500) check('five_hundred_stars');

    let allChinese3 = true;
    let allMath3 = true;
    let allEnglish3 = true;
    let allCompleted = true;
    for (let i = 0; i < 20; i++) {
        if (progress.subjects.chinese.levels[i].stars < 3) allChinese3 = false;
        if (progress.subjects.math.levels[i].stars < 3) allMath3 = false;
        if (progress.subjects.english.levels[i].stars < 3) allEnglish3 = false;
        if (!progress.subjects.chinese.levels[i].completed || !progress.subjects.math.levels[i].completed || !progress.subjects.english.levels[i].completed) {
            allCompleted = false;
        }
    }
    if (allChinese3) check('all_chinese');
    if (allMath3) check('all_math');
    if (allEnglish3) check('all_english');
    if (allCompleted) check('all_subjects');
}

function startDailyChallenge() {
    // 检查今日是否已完成
    const today = new Date().toISOString().slice(0, 10);
    if (!progress.dailyTimes) progress.dailyTimes = [0,0,0,0,0,0,0];
    const dayIdx = new Date().getDay();
    const todayKey = 'dailyDone_' + today;
    if (progress[todayKey]) {
        alert('今日挑战已完成，明天再来吧！');
        return;
    }
    // 从三科中随机各抽3题，共9题
    const allQuestions = [];
    const subjects = ['chinese', 'math', 'english'];
    subjects.forEach(sub => {
        const levels = Q[sub];
        // 从每个科目随机选3个关卡
        const shuffledLevels = levels.slice().sort(() => Math.random() - 0.5);
        const picked = shuffledLevels.slice(0, 3);
        picked.forEach(level => {
            const qs = level.qs.slice().sort(() => Math.random() - 0.5);
            allQuestions.push({ ...qs[0], _subject: sub, _levelName: level.name });
        });
    });
    // 打乱顺序
    allQuestions.sort(() => Math.random() - 0.5);
    // 开始答题
    quizState = {
        questions: allQuestions,
        index: 0,
        score: 0,
        combo: 0,
        maxCombo: 0,
        correct: 0,
        answers: [],
        startTime: Date.now(),
        matchState: null,
        isWrongPractice: false,
        isDaily: true,
        dailyDate: today
    };
    document.getElementById('quiz-title').textContent = '每日挑战';
    document.getElementById('quiz-modal').classList.add('active');
    renderQuiz();
}

// 简易音效
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
            osc.frequency.setValueAtTime(523, ctx.currentTime);
            osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'combo') {
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.5);
        }
    } catch(e) {}
}

            } catch(e) {}
            
            const isUnlocked = mergedProgress[u] && mergedProgress[u].antiAddiction && mergedProgress[u].antiAddiction.unlocked;
            html += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-blur);backdrop-filter:blur(40px);border:1px solid var(--border-blur);border-radius:16px;padding:14px 18px">';
            html += '<div><div style="font-weight:600;color:var(--text-primary)">' + u + (isUnlocked ? ' <span style="color:var(--accent-green);font-size:0.75rem">[已解限]</span>' : '') + '</div><div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px">' + info + '</div></div>';
            html += '<div style="display:flex;gap:8px">';
            html += '<button onclick="unlockUserAntiAddiction(\'' + u + '\')" style="background:rgba(125,196,165,0.15);border:1px solid rgba(125,196,165,0.3);color:#4ecdc4;padding:6px 14px;border-radius:10px;cursor:pointer;font-size:0.85rem;transition:all 0.3s" onmouseover="this.style.background=\'rgba(125,196,165,0.3)\'" onmouseout="this.style.background=\'rgba(125,196,165,0.15)\'">' + (isUnlocked ? '恢复限制' : '解除限制') + '</button>';
            html += '<button onclick="deleteUser(\'' + u + '\')" style="background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;padding:6px 14px;border-radius:10px;cursor:pointer;font-size:0.85rem;transition:all 0.3s" onmouseover="this.style.background=\'rgba(255,80,80,0.3)\'" onmouseout="this.style.background=\'rgba(255,80,80,0.15)\'">删除</button>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
    }
    
    html += '<button onclick="clearAllTrashUsers()" style="margin-top:20px;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;padding:12px 24px;border-radius:16px;cursor:pointer;font-size:0.9rem;width:100%;transition:all 0.3s" onmouseover="this.style.background=\'rgba(255,80,80,0.2)\'" onmouseout="this.style.background=\'rgba(255,80,80,0.1)\'">清除无进度垃圾账号</button>';
    html += '</div>';
    
    adminDiv.innerHTML = html;
}

async function deleteUser(username) {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    showDeleteConfirmModal(username);
}

function showDeleteConfirmModal(username) {
    const existing = document.getElementById('delete-confirm-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'delete-confirm-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML = `
        <div style="background:linear-gradient(135deg,#FFF8F0,#F0F8FF);border-radius:24px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
            <div style="font-size:2.5rem;margin-bottom:8px">&#9888;&#65039;</div>
            <h3 style="margin:0 0 4px;color:var(--text-primary);font-size:1.1rem">确认删除</h3>
            <p style="color:var(--text-secondary);margin:0 0 20px;font-size:0.9rem">确定要删除用户 "${username}" 吗？该用户的所有数据将被清除。此操作不可撤销。</p>
            <div style="display:flex;flex-direction:column;gap:10px">
                <button id="delete-confirm-btn" style="background:rgba(255,80,80,0.9);color:#fff;border:none;padding:14px;border-radius:14px;font-size:1rem;cursor:pointer;width:100%">确认删除</button>
                <button id="delete-cancel-btn" style="background:transparent;border:none;color:var(--text-secondary);padding:10px;font-size:0.95rem;cursor:pointer">取消</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('delete-cancel-btn').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    document.getElementById('delete-confirm-btn').onclick = async () => {
        modal.remove();
        const usersKey = 'starAcademyUsers';
        let users = {};
        try { users = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
        delete users[username];
        localStorage.setItem(usersKey, JSON.stringify(users));
        localStorage.removeItem('starAcademy_' + username);
        if (localStorage.getItem('starAcademyCurrentUser') === username) {
            localStorage.removeItem('starAcademyCurrentUser');
        }
        try {
            const cloud = await ghRead();
            if (cloud) {
                if (cloud.data.users) delete cloud.data.users[username];
                if (cloud.data.progress) delete cloud.data.progress[username];
                await ghWrite(cloud.data, cloud.sha, 'Delete user ' + username);
            }
        } catch(e) {}
        showAdminPanel();
    };
}

async function clearAllTrashUsers() {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    const usersKey = 'starAcademyUsers';
    let users = {};
    try { users = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
    const allUsers = Object.keys(users).filter(u => u !== 'admin');
    let trashCount = 0;
    allUsers.forEach(u => {
        try {
            const p = JSON.parse(localStorage.getItem('starAcademy_' + u) || '{}');
            if (!p.questionsAnswered || p.questionsAnswered === 0) {
                trashCount++;
                delete users[u];
                localStorage.removeItem('starAcademy_' + u);
            }
        } catch(e) {
            trashCount++;
            delete users[u];
            localStorage.removeItem('starAcademy_' + u);
        }
    });
    localStorage.setItem(usersKey, JSON.stringify(users));
    // 云端同步删除
    try {
        const cloud = await ghRead();
        if (cloud) {
            for (const u of allUsers) {
                const p = localStorage.getItem('starAcademy_' + u);
                if (!p) {
                    if (cloud.data.users) delete cloud.data.users[u];
                    if (cloud.data.progress) delete cloud.data.progress[u];
                }
            }
            await ghWrite(cloud.data, cloud.sha, 'Clear trash users');
        }
    } catch(e) {}
    alert('已清除 ' + trashCount + ' 个无进度账号');
    showAdminPanel();
}

async function unlockUserAntiAddiction(username) {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    let targetProgress = null;
    try {
        const p = localStorage.getItem('starAcademy_' + username);
        if (p) targetProgress = JSON.parse(p);
    } catch(e) {}

    // 本地修改
    if (targetProgress) {
        if (!targetProgress.antiAddiction) {
            targetProgress.antiAddiction = {
                todayDate: '',
                todayTotalSeconds: 0,
                devices: {},
                unlocked: false,
                _lastTick: 0
            };
        }
        targetProgress.antiAddiction.unlocked = !targetProgress.antiAddiction.unlocked;
        localStorage.setItem('starAcademy_' + username, JSON.stringify(targetProgress));
    }

    // 云端同步
    try {
        const cloud = await ghRead();
        if (cloud && cloud.data.progress && cloud.data.progress[username]) {
            const cp = cloud.data.progress[username];
            if (!cp.antiAddiction) {
                cp.antiAddiction = {
                    todayDate: '',
                    todayTotalSeconds: 0,
                    devices: {},
                    unlocked: false,
                    _lastTick: 0
                };
            }
            cp.antiAddiction.unlocked = targetProgress ? targetProgress.antiAddiction.unlocked : true;
            await ghWrite(cloud.data, cloud.sha, 'Toggle anti-addiction for ' + username);
        }
    } catch(e) {}

    const action = targetProgress && targetProgress.antiAddiction && targetProgress.antiAddiction.unlocked ? '解除' : '恢复';
    alert('已' + action + '用户 "' + username + '" 的防沉迷限制');
    showAdminPanel();
}
</script>
