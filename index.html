async function handleAuth() {
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value.trim();
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if (username.length < 2 || username.length > 10) { errEl.textContent = '用户名需要2-10个字'; return; }
    if (password.length < 4 || password.length > 20) { errEl.textContent = '密码需要4-20位'; return; }
    const usersKey = 'starAcademyUsers';
    let users = {};
    try { users = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
    
    if (authMode === 'register') {
        if (username === 'admin') { errEl.textContent = '该用户名不可用'; return; }
        // 先检查云端是否已存在
        const cloud = await ghRead();
        if (cloud && cloud.data.users && cloud.data.users[username]) { errEl.textContent = '用户名已存在，请换一个'; return; }
        if (users[username]) { errEl.textContent = '用户名已存在，请换一个'; return; }
        users[username] = { password: password };
        localStorage.setItem(usersKey, JSON.stringify(users));
        currentUser = username;
        isAdmin = false;
        localStorage.setItem('starAcademyCurrentUser', username);
        progress = createNewProgress();
        saveUserProgress();
        // 异步同步到云端
        ghSyncUsers(users);
        closeAuthModal();
        loadGradePreference();
        initApp();
    } else {
        // 本地没有，尝试从云端加载
        if (!users[username]) {
            errEl.textContent = '正在从云端同步...';
            const cloud = await ghRead();
            if (cloud && cloud.data.users && cloud.data.users[username]) {
                // 同步到本地
                users[username] = cloud.data.users[username];
                localStorage.setItem(usersKey, JSON.stringify(users));
                // 同步进度
                if (cloud.data.progress && cloud.data.progress[username]) {
                    localStorage.setItem('starAcademy_' + username, JSON.stringify(cloud.data.progress[username]));
                }
            }
        }
        if (!users[username]) { errEl.textContent = '用户名不存在，请先注册'; return; }
        if (users[username].password !== password) { errEl.textContent = '密码错误'; return; }
        // 管理员判断
        if (username === 'admin') {
            currentUser = username;
            localStorage.setItem('starAcademyCurrentUser', username);
            isAdmin = true;
            progress = createNewProgress();
            // 确保管理员不继承任何旧数据
            localStorage.removeItem('starAcademy_admin');
            closeAuthModal();
            initApp();
            showAdminPanel();
            return;
        }
        currentUser = username;
        isAdmin = false;
        localStorage.setItem('starAcademyCurrentUser', username);
        progress = loadUserProgress();
        closeAuthModal();
        loadGradePreference();
        initApp();
    }
}

// 同步用户列表到云端
async function ghSyncUsers(users) {
    try {
        const cloud = await ghRead();
        if (!cloud) return;
        cloud.data.users = users;
        // 同步进度
        if (!cloud.data.progress) cloud.data.progress = {};
        for (const u of Object.keys(users)) {
            if (u === 'admin') continue;
            const p = localStorage.getItem('starAcademy_' + u);
            if (p) cloud.data.progress[u] = JSON.parse(p);
        }
        await ghWrite(cloud.data, cloud.sha, 'Sync users');
    } catch(e) { console.log('Sync users error:', e); }
}

// 同步单个用户进度到云端
async function ghSyncProgress(username, progressData) {
    try {
        const cloud = await ghRead();
        if (!cloud) return;
        if (!cloud.data.progress) cloud.data.progress = {};
        cloud.data.progress[username] = progressData;
        await ghWrite(cloud.data, cloud.sha, `Update ${username} progress`);
    } catch(e) { console.log('Sync progress error:', e); }
}

function createNewProgress() {
    const p = {
        subjects: {},
        totalStars: 0,
        xp: 0,
        level: 1,
        diamonds: 0,
        dailyStreak: 0,
        lastDailyDate: '',
        studyTime: 0,
        questionsAnswered: 0,
        correctAnswers: 0,
        dailyTimes: [0,0,0,0,0,0,0],
        achievements: [],
        eyeCare: false,
        wrongBook: { chinese: [], math: [], english: [] },
        antiAddiction: {
            todayDate: '',
            todayTotalSeconds: 0,
            devices: {},
            unlocked: false,
            _lastTick: 0
        },
        // V9 新增字段
        dailyGoal: 10,           // 每日学习目标题数
        dailyGoalDate: '',       // 每日目标日期
        dailyGoalProgress: 0,    // 每日目标已完成题数
        studyCalendar: {},       // 学习日历 { 'YYYY-MM-DD': count }
        accuracyHistory: [],     // 正确率历史 [{date, subject, accuracy, total}]
        subjectMastery: { chinese: 0, math: 0, english: 0 } // 学科掌握度
    };
    for (const sub of ['chinese','math','english']) {
        p.subjects[sub] = { levels: [] };
        for (let i = 0; i < 30; i++) { // 30以兼容不同年级的关卡数
            p.subjects[sub].levels.push({ stars: 0, completed: false });
        }
    }
    return p;
}

function loadUserProgress() {
    const key = 'starAcademy_' + currentUser;
    const saved = localStorage.getItem(key);
    if (saved) {
        try {
            const p = JSON.parse(saved);
            if (!p.subjects) return createNewProgress();
            for (const sub of ['chinese','math','english']) {
                if (!p.subjects[sub] || !p.subjects[sub].levels) return createNewProgress();
                while (p.subjects[sub].levels.length < 30) p.subjects[sub].levels.push({ stars: 0, completed: false });
            }
            if (!p.dailyTimes || p.dailyTimes.length < 7) p.dailyTimes = [0,0,0,0,0,0,0];
            if (!p.achievements) p.achievements = [];
            if (!p.xp) p.xp = 0;
            if (!p.level) p.level = 1;
            if (!p.diamonds) p.diamonds = 0;
            if (!p.wrongBook) p.wrongBook = { chinese: [], math: [], english: [] };
            if (!p.wrongBook.chinese) p.wrongBook.chinese = [];
            if (!p.wrongBook.math) p.wrongBook.math = [];
            if (!p.wrongBook.english) p.wrongBook.english = [];
            if (!p.antiAddiction) {
                p.antiAddiction = {
                    todayDate: '',
                    todayTotalSeconds: 0,
                    devices: {},
                    unlocked: false,
                    _lastTick: 0
                };
            }
            return p;
        } catch(e) { return createNewProgress(); }
    }
    return createNewProgress();
}

// ==================== 防沉迷系统 ====================
const AA_CONTINUOUS_LIMIT = 30 * 60; // 30分钟连续
const AA_DAILY_LIMIT = 2 * 60 * 60;   // 2小时总计
const AA_IDLE_THRESHOLD = 5 * 60 * 1000; // 5分钟无操作视为 idle
const AA_BREAK_TIME = 5 * 60; // 休息5分钟

let aaTimer = null;
let aaLocked = false;
let lastUserInteraction = Date.now();

function getDeviceId() {
    let id = localStorage.getItem('starAcademyDeviceId');
    if (!id) {
        id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('starAcademyDeviceId', id);
    }
    return id;
}

function startAntiAddictionTimer() {
    if (aaTimer) clearInterval(aaTimer);
    aaTimer = setInterval(tickAntiAddiction, 10000); // 每10秒心跳
}

function stopAntiAddictionTimer() {
    if (aaTimer) { clearInterval(aaTimer); aaTimer = null; }
}

function tickAntiAddiction() {
    if (!currentUser || currentUser === 'admin' || aaLocked) return;
    if (!progress || !progress.antiAddiction) return;
    const aa = progress.antiAddiction;
    if (aa.unlocked) return;

    const now = Date.now();
    const today = new Date().toISOString().slice(0, 10);
    const deviceId = getDeviceId();

    // 日期切换，重置当日统计
    if (aa.todayDate !== today) {
        aa.todayDate = today;
        aa.todayTotalSeconds = 0;
        aa.devices = {};
    }

    if (!aa.devices[deviceId]) {
        aa.devices[deviceId] = { sessionStart: now, todaySeconds: 0 };
    }

    const dev = aa.devices[deviceId];
    const idle = now - lastUserInteraction;

    // 如果超过 idle 阈值，重置当前 session
    if (idle > AA_IDLE_THRESHOLD) {
        dev.sessionStart = now;
        dev.todaySeconds = 0;
        aa._lastTick = now;
        return;
    }

    // 累加时间（基于心跳间隔）
    const added = aa._lastTick ? Math.floor((now - aa._lastTick) / 1000) : 10;
    aa._lastTick = now;
    dev.todaySeconds += added;
    aa.todayTotalSeconds += added;

    // 检查限制
    const sessionDuration = Math.floor((now - dev.sessionStart) / 1000);

    if (sessionDuration >= AA_CONTINUOUS_LIMIT) {
        showAntiAddictionModal('continuous');
    } else if (aa.todayTotalSeconds >= AA_DAILY_LIMIT) {
        showAntiAddictionModal('daily');
    }

    // 每60秒保存一次进度（避免频繁写）
    if (Math.floor(aa.todayTotalSeconds) % 60 < 10) {
        saveUserProgress();
    }
}

function showAntiAddictionModal(type) {
    aaLocked = true;
    let title = '';

    let btnText = '';
    let countdown = 0;

    if (type === 'continuous') {

        msg = '您已连续学习30分钟，为保护视力，请休息后再继续。';
        btnText = '我知道了';
        countdown = AA_BREAK_TIME;
    } else {
        title = '今日额度已用完';
        msg = '您今日已累计学习2小时，明天再来吧！';
        btnText = '好的';
        countdown = 0;
    }

    const existing = document.getElementById('aa-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'aa-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML = `
        <div style="background:linear-gradient(135deg,#FFF8F0,#F0F8FF);border-radius:24px;padding:28px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)">

            <p style="color:var(--text-secondary);margin:0 0 20px;font-size:0.95rem;line-height:1.6">${msg}</p>
            <div id="aa-countdown" style="font-size:2rem;font-weight:700;color:var(--accent-orange);margin-bottom:20px;font-family:DIN">${countdown > 0 ? formatTime(countdown) : ''}</div>
            <button id="aa-btn" style="background:var(--accent-orange);color:#fff;border:none;padding:14px 40px;border-radius:14px;font-size:1rem;cursor:pointer;transition:all 0.3s;opacity:${countdown > 0 ? '0.5' : '1'}" ${countdown > 0 ? 'disabled' : ''}>${btnText}</button>
        </div>
    `;
    document.body.appendChild(modal);

    if (countdown > 0) {
        let remaining = countdown;
        const cdEl = document.getElementById('aa-countdown');
        const btn = document.getElementById('aa-btn');
        const interval = setInterval(() => {
            remaining--;
            if (cdEl) cdEl.textContent = formatTime(remaining);
            if (remaining <= 0) {
                clearInterval(interval);
                if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '继续学习'; }
            }
        }, 1000);

        btn.onclick = () => {
            if (remaining > 0) return;
            clearInterval(interval);
            modal.remove();
            aaLocked = false;
            // 重置当前设备的 session
            const deviceId = getDeviceId();
            if (progress && progress.antiAddiction && progress.antiAddiction.devices[deviceId]) {
                progress.antiAddiction.devices[deviceId].sessionStart = Date.now();
            }
        };
    } else {
        document.getElementById('aa-btn').onclick = () => {
            modal.remove();
            // 回到首页，锁定操作
            showPage('page-home');
        };
    }
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function calculateLevel() {
    // 每100 XP升一级
    progress.level = Math.floor(progress.xp / 100) + 1;
    return progress.level;
}

function getXpToNextLevel() {
    return 100 - (progress.xp % 100);
}

function getXpPercent() {
    return (progress.xp % 100) / 100 * 100;
}

function addWrongQuestion(question, userAnswer) {
    // 每日挑战没有 quizState.subject，从 question._subject 获取
    const subject = quizState.subject || question._subject || 'chinese';
    const level = quizState.level !== undefined ? quizState.level : -1;
    const levelName = level >= 0 ? Q[currentGrade][subject][level].name : '错题练习';
    
    // V10.3: 检查是否已存在相同错题（避免重复添加）
    const existing = progress.wrongBook[subject].findIndex(w => w.question === question.q);
    if (existing >= 0) {
        // 已存在，重置复习状态（因为又答错了）
        progress.wrongBook[subject][existing].reviewCount = 0;
        progress.wrongBook[subject][existing].nextReviewTime = Date.now();
        progress.wrongBook[subject][existing].lastWrongTime = Date.now();
        progress.wrongBook[subject][existing].userAnswer = userAnswer;
        saveUserProgress();
        return;
    }
    
    const wrongItem = {
        subject,
        level,
        levelName,
        question: question.q,
        answer: question.a,
        userAnswer,
        type: question.t,
        options: question.o,
        explanation: question.explanation,
        timestamp: Date.now(),
        lastWrongTime: Date.now(),
        reviewCount: 0,
        nextReviewTime: Date.now()
    };
    progress.wrongBook[subject].push(wrongItem);
    saveUserProgress();
}

function removeWrongQuestion(subject, index) {
    progress.wrongBook[subject].splice(index, 1);
    saveUserProgress();
}

    const saved = localStorage.getItem('starAcademyCurrentUser');

        currentUser = saved;
        if (saved === 'admin') {
            isAdmin = true;
            progress = createNewProgress();
            localStorage.removeItem('starAcademy_admin');
        } else {
            isAdmin = false;
            progress = loadUserProgress();

        closeAuthModal();
        loadGradePreference();
        initApp();

}

function recalcTotalStars() {
    let total = 0;
    for (const sub of ['chinese','math','english']) {
        for (const lv of progress.subjects[sub].levels) total += lv.stars;
    }
    progress.totalStars = total;
}

let navHistory = [];

function showPage(pageId) {
    // 保存当前页面到历史
    if (currentPage && currentPage !== pageId) {
        navHistory.push(currentPage);
    }
    
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    currentPage = pageId;

    document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
    const navMap = { 'page-home': 0, 'page-subject': -1, 'page-stats': 4, 'page-wrongbook': 5, 'page-parent': 6 };
    if (navMap[pageId] >= 0) document.querySelectorAll('.bottom-nav .nav-item')[navMap[pageId]].classList.add('active');

    if (pageId === 'page-home') { renderHome(); navHistory = []; }
    if (pageId === 'page-parent') renderParentDashboard();
    if (pageId === 'page-wrongbook') renderWrongbook();
    if (pageId === 'page-stats') renderStats();
    window.scrollTo(0, 0);
}

function goBack() {
    // 如果答题中，优先弹出退出弹窗
    if (quizState && document.getElementById('quiz-modal').classList.contains('active')) {
        showExitQuizModal();
        return;
    }
    if (navHistory.length > 0) {
        const prevPage = navHistory.pop();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(prevPage).classList.add('active');
        currentPage = prevPage;
        
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        const navMap = { 'page-home': 0, 'page-stats': 4, 'page-wrongbook': 5, 'page-parent': 6 };
        if (navMap[prevPage] >= 0) document.querySelectorAll('.bottom-nav .nav-item')[navMap[prevPage]].classList.add('active');
        
        if (prevPage === 'page-home') renderHome();
        if (prevPage === 'page-parent') renderParentDashboard();
        if (prevPage === 'page-wrongbook') renderWrongbook();
        window.scrollTo(0, 0);
    } else {
        showPage('page-home');
    }
}

// 从题库自动生成例题讲解（无专属学习内容时使用）
function autoGenLearnData(levelInfo) {
    const examples = [];
    const qs = levelInfo.qs || [];
    const subjName = { chinese: '\u8bed\u6587', math: '\u6570\u5b66', english: '\u82f1\u8bed' }[currentSubject] || '';
    const gd = { '\u4e00\u5e74\u7ea7':'\u5c0f\u5b66\u4e00\u5e74\u7ea7','\u4e8c\u5e74\u7ea7':'\u5c0f\u5b66\u4e8c\u5e74\u7ea7','\u4e09\u5e74\u7ea7':'\u5c0f\u5b66\u4e09\u5e74\u7ea7','\u56db\u5e74\u7ea7':'\u5c0f\u5b66\u56db\u5e74\u7ea7','\u4e94\u5e74\u7ea7':'\u5c0f\u5b66\u4e94\u5e74\u7ea7','\u516d\u5e74\u7ea7':'\u5c0f\u5b66\u516d\u5e74\u7ea7','\u4e03\u5e74\u7ea7':'\u521d\u4e2d\u4e03\u5e74\u7ea7','\u516b\u5e74\u7ea7':'\u521d\u4e2d\u516b\u5e74\u7ea7','\u4e5d\u5e74\u7ea7':'\u521d\u4e2d\u4e5d\u5e74\u7ea7' };
    const desc = (gd[currentGrade]||'') + subjName + '\u00b7' + levelInfo.name + '\u3002\u901a\u8fc7\u4ee5\u4e0b\u4f8b\u9898\u9884\u4e60\u77e5\u8bc6\u70b9\uff0c\u7136\u540e\u5f00\u59cb\u7ec3\u4e60\u5427\uff01';

    // 优先按题型各取一道，确保每种题型都有例题讲解；不足3道时再补齐
    const picked = [];
    const seenType = {};
    for (const q of qs) {
        if (!seenType[q.t]) { seenType[q.t] = 1; picked.push(q); if (picked.length >= 3) break; }
    }
    if (picked.length < 3) {
        for (const q of qs) {
            if (picked.indexOf(q) === -1) { picked.push(q); if (picked.length >= 3) break; }
        }
    }
    const typeName = { choice: '选择题', fill: '填空题', tf: '判断题', match: '连线题', listen: '听力题', order: '排序题' };
    for (let i = 0; i < picked.length; i++) {
        const q = picked[i];
        let content = '', detail = '';
        if (q.t === 'order') {
            // 排序题通过 submitOrder 按钮提交，nextQuestion 时不自动触发
        } else if (q.t === 'choice') {
            content = q.q + '\n';
            q.o.forEach((opt, idx) => {
                content += String.fromCharCode(65 + idx) + '. ' + opt;
                if (idx === q.a) content += ' \u2190 \u6b63\u786e\u7b54\u6848';
                content += '\n';
            });
            content = content.trim();
            detail = '\u6b63\u786e\u7b54\u6848\u662f ' + String.fromCharCode(65 + q.a) + '\u3002';
        } else if (q.t === 'fill') {
            content = q.q;
            detail = '\u7b54\u6848\uff1a' + q.a;
        } else if (q.t === 'tf') {
            content = q.q;
            detail = q.a ? '\u6b63\u786e\u3002' : '\u9519\u8bef\u3002';
        } else if (q.t === 'match') {
            content = q.q;
            detail = '\u8bf7\u5c06\u5de6\u53f3\u4e24\u5217\u5185\u5bb9\u6b63\u786e\u914d\u5bf9\u3002';
        } else if (q.t === 'listen') {
            content = '\u542c\u97f3\u9898\uff1a' + q.q;
            detail = '\u5355\u8bcd\uff1a' + (q.word||'') + '\uff0c\u8bf7\u4ed4\u7ec6\u542c\u53d1\u97f3\u540e\u9009\u62e9\u3002';
        }
        if (content) examples.push({ t: '例题' + (i+1) + '·' + (typeName[q.t]||''), c: content, d: detail });
    }
    return { title: levelInfo.name, desc: desc, examples: examples };
}

// ==================== Web Speech API ====================
function speakWord(word) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        u.rate = 0.8;
        u.pitch = 1.1;
        // 单个字母或短单词时，确保自然发音而非逐字母拼读
        if (word.length <= 2 && /^[a-zA-Z]+$/.test(word)) {
            // 使用更自然的单字母/短词发音
            u.text = word.toLowerCase();
        }
        window.speechSynthesis.speak(u);
    } else {
        alert('您的浏览器不支持语音功能');
    }
}

function speakLetter(letter) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(letter);
        u.lang = 'en-US';
        u.rate = 0.7;
        u.pitch = 1.2;
        // 确保字母自然发音，不读 "Capital B"
        u.text = letter.toLowerCase();
        window.speechSynthesis.speak(u);
    }
}

// V10.3: 智能复习 - 基于艾宾浩斯遗忘曲线筛选需要复习的错题
function startSmartReview() {
    const wrongList = progress.wrongBook[currentWrongbookTab];
    if (!wrongList || wrongList.length === 0) {
        alert('没有错题可以练习');
        return;
    }
    const now = Date.now();
    const needReview = wrongList.filter(item => !item.nextReviewTime || item.nextReviewTime <= now);
    if (needReview.length === 0) {
        alert('暂无需要复习的错题，下次复习时间未到');
        return;
    }
    startQuizFromList(currentWrongbookTab, needReview);
}

// V10.3: 艾宾浩斯遗忘曲线间隔计算
function calculateNextReview(reviewCount) {
    const intervals = [
        30 * 60 * 1000,      // 0次复习 -> 30分钟后
        12 * 60 * 60 * 1000,  // 1次复习 -> 12小时后
        24 * 60 * 60 * 1000,  // 2次复习 -> 1天后
        2 * 24 * 60 * 60 * 1000, // 3次复习 -> 2天后
        4 * 24 * 60 * 60 * 1000, // 4次复习 -> 4天后
        7 * 24 * 60 * 60 * 1000, // 5次复习 -> 7天后
        15 * 24 * 60 * 60 * 1000  // 6+次复习 -> 15天后
    ];
    const idx = Math.min(reviewCount, intervals.length - 1);
    return Date.now() + intervals[idx];
}

function startQuizFromList(subject, questions) {

        level: -1,

}

// ==================== 答题逻辑 ====================
function startQuiz(subject, level) {
    combo = 0;
    const levelData = Q[currentGrade][subject][level];
    quizState = {
        subject, level,
        questions: levelData.qs,
        index: 0,
        correct: 0,
        startTime: Date.now(),
        answers: [],
        matchState: null,
        isWrongPractice: false,
        questionTimes: [],
        questionStartTime: Date.now()
    };
    document.getElementById('quiz-title').textContent = SUBJECT_INFO[subject].name + ' - 第' + (level + 1) + '关 ' + levelData.name;
    renderQuiz();
    document.getElementById('quiz-modal').classList.add('active');
}

function renderQuiz() {

    // V10.3: 启动每题计时器
    quizState.questionStartTime = Date.now();
    const timerEl = document.getElementById('quiz-timer');
    if (timerEl) {
        timerEl.style.display = 'block';
        timerEl.textContent = '⏱ 0s';
        if (quizState._timerInterval) clearInterval(quizState._timerInterval);
        quizState._timerInterval = setInterval(function() {
            const elapsed = Math.floor((Date.now() - quizState.questionStartTime) / 1000);
            if (timerEl) {
                let display = elapsed + 's';
                if (elapsed >= 60) display = Math.floor(elapsed / 60) + 'm' + (elapsed % 60) + 's';
                if (elapsed >= 30) timerEl.style.color = '#E88B8B';
                else timerEl.style.color = 'var(--accent-orange)';
                timerEl.textContent = '⏱ ' + display;
            }
        }, 1000);
    }

    // V10.2: 显示阅读语篇
    let passageHTML = '';
    if (currentGrade && quizState.questions[quizState.index]) {
        const q = quizState.questions[quizState.index];
        const levelName = q._levelName || '';
        // 检查是否有对应的阅读语篇
        if (READING_PASSAGES && READING_PASSAGES[currentGrade]) {
            const rp = READING_PASSAGES[currentGrade].find(p => p.name === levelName);
            if (rp && rp.passage) {
                passageHTML = '<div class="quiz-passage"><div class="quiz-passage-title">📖 阅读材料</div><div class="quiz-passage-text">' + rp.passage.replace(/\n/g, '<br>') + '</div></div>';
            }
        }
        // 检查完形填空语篇
        if (!passageHTML && CLOZE_PASSAGES && CLOZE_PASSAGES[currentGrade]) {
            const cp = CLOZE_PASSAGES[currentGrade].find(p => p.name === levelName);
            if (cp && cp.passage) {
                passageHTML = '<div class="quiz-passage"><div class="quiz-passage-title">📖 完形填空</div><div class="quiz-passage-text">' + cp.passage.replace(/\n/g, '<br>') + '</div></div>';
            }
        }
    }
    const q = quizState.questions[quizState.index];
    const type = q.t || 'choice';

    // 进度条
    const prog = document.getElementById('quiz-progress');
    prog.innerHTML = '';
    for (let i = 0; i < quizState.questions.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'quiz-dot';
        if (i < quizState.index) {
            dot.classList.add(quizState.answers[i] ? 'correct' : 'wrong');
        }
        if (i === quizState.index) dot.classList.add('current');
        prog.appendChild(dot);
    }

    // 题型标签
    const typeNames = { choice: '选择题', fill: '填空题', match: '连线配对', listen: '听音选词', tf: '判断对错', order: '排序题' };
    document.getElementById('quiz-type-badge').textContent = '【' + (typeNames[type] || '选择题') + '】';

    // 题目
    document.getElementById('question-area').innerHTML = (passageHTML || '') + '<div class="q-text">' + '第' + (quizState.index + 1) + '题：' + q.q + '</div>';

    const opts = document.getElementById('answer-options');
    const footer = document.getElementById('quiz-footer');
    opts.innerHTML = '';
    footer.innerHTML = '';

    switch (type) {
        case 'choice':
            renderChoice(q, opts);
            break;
        case 'fill':
            renderFill(q, opts, footer);
            break;
        case 'match':
            renderMatch(q, opts);
            break;
        case 'listen':
            renderListen(q, opts);
            break;
        case 'tf':
            renderTF(q, opts);
            break;
        case 'order':
            renderOrder(q, opts, footer);
            break;
        default:
            renderChoice(q, opts);
    }
}

function renderChoice(q, opts) {
    const correctText = q.o[q.a];
    const shuffled = fisherYatesShuffle(q.o);
    const newCorrectIdx = shuffled.indexOf(correctText);
    q._shuffled = shuffled;
    q._shuffledCorrect = newCorrectIdx;
    opts.style.display = 'grid';
    shuffled.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = opt;
        btn.onclick = () => handleChoice(idx === newCorrectIdx, q);
        opts.appendChild(btn);
    });
}

function handleChoice(correct, question) {
    const q = quizState.questions[quizState.index];
    const btns = document.querySelectorAll('.answer-options .answer-btn');
    btns.forEach(b => b.disabled = true);
    const correctIdx = q._shuffledCorrect;

    if (correct) {
        btns[correctIdx].classList.add('correct');
        btns[correctIdx].classList.add('correct-pulse');
        combo++;
        progress.xp += 10 + combo * 5;
        const oldLevel = progress.level;
        calculateLevel();
        if (progress.level > oldLevel) {
            showFireworks();
            setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
        }
        quizState.correct++;
        createRewardParticles(10);
        if (combo > 1) {
            showCombo(combo);
        }
        playSound('correct');
    } else {
        btns[correctIdx].classList.add('correct');
        btns.forEach((b, i) => { if (i !== correctIdx) b.classList.add('wrong'); });
        btns[btns.length - 1].classList.add('wrong-shake');
        if (combo >= 5) {
            showReward('连击中断');
        }
        combo = 0;
        playSound('wrong');
        // 记录错题
        const userAnswer = q._shuffled[btns.length - 1 - (btns.length - correctIdx)];
        addWrongQuestion(question, userAnswer);
    }

    quizState.answers.push(correct);
    progress.questionsAnswered++;
    if (correct) progress.correctAnswers++;
    showContinueButton();
}

    opts.style.display = 'block';

        const inp = document.getElementById('fill-answer');

            inp.addEventListener('keydown', function(e) {

function handleFill() {
    const inp = document.getElementById('fill-answer');
    if (!inp) return;
    const userAnswer = inp.value.trim();
    if (!userAnswer) return;
    const q = quizState.questions[quizState.index];
    const correctAnswer = q.a;
    const isCorrect = userAnswer === correctAnswer ||
        userAnswer.toLowerCase() === correctAnswer.toLowerCase() ||
        userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');

    const submitBtn = document.querySelector('.submit-btn');
    if (submitBtn) submitBtn.disabled = true;
    inp.disabled = true;

    if (isCorrect) {
        inp.classList.add('correct');
        combo++;
        progress.xp += 10 + combo * 5;
        const oldLevel = progress.level;
        calculateLevel();
        if (progress.level > oldLevel) {
            showFireworks();
            setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
        }
        quizState.correct++;
        createRewardParticles(10);
        if (combo > 1) showCombo(combo);
        playSound('correct');
    } else {
        inp.classList.add('wrong');
        const correctDiv = document.createElement('div');
        correctDiv.style.cssText = 'color:#4ecdc4;margin-top:8px;font-size:0.95rem;text-align:center';
        correctDiv.textContent = '正确答案：' + correctAnswer;
        document.getElementById('answer-options').appendChild(correctDiv);
        if (combo >= 5) showReward('连击中断');
        combo = 0;
        playSound('wrong');
        addWrongQuestion(q, userAnswer);
    }

    quizState.answers.push(isCorrect);
    progress.questionsAnswered++;
    if (isCorrect) progress.correctAnswers++;
    showContinueButton();
}

function renderMatch(q, opts) {
    opts.style.display = 'block';
    const pairs = q.pairs;
    const leftItems = fisherYatesShuffle(pairs.map(p => p[0]));
    const rightItems = fisherYatesShuffle(pairs.map(p => p[1]));

    quizState.matchState = {
        pairs: pairs,
        leftItems: leftItems,
        rightItems: rightItems,
        selectedLeft: null,
        selectedRight: null,
        matched: [],
        correctCount: 0
    };

    let html = '<div class="match-container">';
    html += '<div class="match-column" id="match-left">';
    leftItems.forEach((item, i) => {
        html += `<div class="match-item" data-side="left" data-idx="${i}" data-val="${item.replace(/'/g, "\'")}" onclick="selectMatch('left',${i},'${item.replace(/'/g, "\'")}')">${item}</div>`;
    });
    html += '</div>';
    html += '<div class="match-column" id="match-right">';
    rightItems.forEach((item, i) => {
        html += `<div class="match-item" data-side="right" data-idx="${i}" data-val="${item.replace(/'/g, "\'")}" onclick="selectMatch('right',${i},'${item.replace(/'/g, "\'")}')">${item}</div>`;
    });
    html += '</div></div>';
    opts.innerHTML = html;
}

function selectMatch(side, idx, val) {
    const ms = quizState.matchState;
    if (!ms) return;

    if (ms.matched.includes(val)) return;

    document.querySelectorAll('.match-item.selected').forEach(el => el.classList.remove('selected'));

    if (side === 'left') {
        ms.selectedLeft = { idx, val };
        document.querySelector(`#match-left .match-item[data-idx="${idx}"]`).classList.add('selected');
    } else {
        ms.selectedRight = { idx, val };
        document.querySelector(`#match-right .match-item[data-idx="${idx}"]`).classList.add('selected');
    }

    if (ms.selectedLeft && ms.selectedRight) {
        const leftVal = ms.selectedLeft.val;
        const rightVal = ms.selectedRight.val;
        const isCorrect = ms.pairs.some(p => p[0] === leftVal && p[1] === rightVal);

        const leftEl = document.querySelector(`#match-left .match-item[data-idx="${ms.selectedLeft.idx}"]`);
        const rightEl = document.querySelector(`#match-right .match-item[data-idx="${ms.selectedRight.idx}"]`);

        if (isCorrect) {
            leftEl.classList.add('matched');
            rightEl.classList.add('matched');
            leftEl.classList.remove('selected');
            rightEl.classList.remove('selected');
            ms.matched.push(leftVal, rightVal);
            ms.correctCount++;
            combo++;
            progress.xp += 10 + combo * 5;
            const oldLevel = progress.level;
            calculateLevel();
            if (progress.level > oldLevel) {
                showFireworks();
                setTimeout(() => alert(`恭喜！升级了！现在是Lv.${progress.level}`), 1000);
            }
            createRewardParticles(10);
            if (combo > 1) showCombo(combo);
            playSound('correct');
            showReward('配对正确！');

            if (ms.correctCount >= ms.pairs.length) {
                quizState.answers.push(true);
                quizState.correct++;
                progress.questionsAnswered++;
                progress.correctAnswers++;
                showContinueButton();
            }
        } else {
            leftEl.classList.add('wrong-flash');
            rightEl.classList.add('wrong-flash');
            setTimeout(() => {
                leftEl.classList.remove('wrong-flash', 'selected');
                rightEl.classList.remove('wrong-flash', 'selected');
            }, 400);
            if (combo >= 5) showReward('连击中断');
            combo = 0;
            playSound('wrong');
            addWrongQuestion(q, `${leftVal}-${rightVal}`);
        }
        ms.selectedLeft = null;
        ms.selectedRight = null;
    }
}

// ==================== V9 排序题型 ====================
function renderOrder(q, opts, footer) {
    opts.style.display = 'block';
    const items = q.items || [];
    const shuffled = fisherYatesShuffle(items.map((item, idx) => ({ text: item, originalIdx: idx })));

    let html = '<div class="order-container" id="order-container">';
    shuffled.forEach((item, i) => {
        html += `
            <div class="order-item" draggable="true" data-original-idx="${item.originalIdx}" data-text="${item.text}">
                <div class="order-index">${i + 1}</div>
                <div class="order-text">${item.text}</div>
                <div class="order-handle">⠿</div>
            </div>
        `;
    });
    html += '</div>';

    html += `
        <button class="start-btn" id="order-submit-btn" onclick="submitOrder()" style="margin-top:16px;width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent-orange),var(--gold));color:white;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.3s">
            确认排序
        </button>
    `;

    opts.innerHTML = html;
    initOrderDrag();
}

function initOrderDrag() {
    const container = document.getElementById('order-container');
    if (!container) return;

    let draggedItem = null;

    container.querySelectorAll('.order-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            draggedItem = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            updateOrderIndices();
        });

        item.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (draggedItem && draggedItem !== item) {
                item.classList.add('drag-over');
            }
        });

        item.addEventListener('dragleave', () => {
            item.classList.remove('drag-over');
        });

        item.addEventListener('drop', (e) => {
            e.preventDefault();
            item.classList.remove('drag-over');
            if (draggedItem && draggedItem !== item) {
                const rect = item.getBoundingClientRect();
                const midpoint = rect.top + rect.height / 2;
                if (e.clientY < midpoint) {
                    container.insertBefore(draggedItem, item);
                } else {
                    container.insertBefore(draggedItem, item.nextSibling);
                }
                updateOrderIndices();
            }
        });

        let touchStartY = 0;
        let touchItem = null;
        item.addEventListener('touchstart', (e) => {
            touchItem = item;
            touchStartY = e.touches[0].clientY;
            item.classList.add('dragging');
        }, { passive: true });

        item.addEventListener('touchmove', (e) => {
            if (!touchItem) return;
            e.preventDefault();
            const touchY = e.touches[0].clientY;
            const items = container.querySelectorAll('.order-item');
            items.forEach(other => {
                if (other === touchItem) return;
                const rect = other.getBoundingClientRect();
                if (touchY > rect.top && touchY < rect.bottom) {
                    const mid = rect.top + rect.height / 2;
                    if (touchY < mid) {
                        container.insertBefore(touchItem, other);
                    } else {
                        container.insertBefore(touchItem, other.nextSibling);
                    }
                    updateOrderIndices();
                }
            });
        }, { passive: false });

        item.addEventListener('touchend', () => {
            if (touchItem) {
                touchItem.classList.remove('dragging');
                touchItem = null;
            }
        });
    });
}

function updateOrderIndices() {
    const container = document.getElementById('order-container');
    if (!container) return;
    container.querySelectorAll('.order-item').forEach((item, i) => {
        const idx = item.querySelector('.order-index');
        if (idx) idx.textContent = i + 1;
    });
}

function submitOrder() {
    const container = document.getElementById('order-container');
    if (!container) return;

    const items = container.querySelectorAll('.order-item');
    const currentOrder = Array.from(items).map(item => parseInt(item.dataset.originalIdx));
    const q = quizState.questions[quizState.index];
    const correctOrder = q.a || [];

    const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(correctOrder);

    items.forEach((item, i) => {
        if (currentOrder[i] === correctOrder[i]) {
            item.classList.add('placed');
        } else {
            item.classList.add('placed', 'wrong');
        }
    });

    const btn = document.getElementById('order-submit-btn');
    if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = isCorrect ? '✓ 排序正确！' : '✗ 排序错误';
    }

    handleOrderResult(isCorrect, q);
}

function handleOrderResult(correct, question) {
    quizState.answers[quizState.index] = correct;

    if (correct) {
        combo++;
        progress.xp += 15 + combo * 5;
        progress.correctAnswers++;
        playSound('correct');
        if (combo >= 5) showCombo(combo);
    } else {
        combo = 0;
        progress.xp += 2;
        playSound('wrong');
        addWrongQuestion(question, '排序错误');
    }

    progress.questionsAnswered++;
    calculateLevel();
    saveUserProgress();

    showContinueButton();
}

function showAchievementToast(ach) {

    toast.className = 'achievement-toast';
    toast.innerHTML = ach.icon + ' 成就解锁：' + ach.name;
    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 50);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 500);

}

function showContinueButton() {
    // V10.3: 停止计时器并记录本题用时
    if (quizState._timerInterval) {
        clearInterval(quizState._timerInterval);
        quizState._timerInterval = null;
    }
    const timerEl = document.getElementById('quiz-timer');
    if (timerEl) timerEl.style.display = 'none';
    const qTime = Math.floor((Date.now() - (quizState.questionStartTime || Date.now())) / 1000);
    if (!quizState.questionTimes) quizState.questionTimes = [];
    quizState.questionTimes.push(qTime);

    const footer = document.getElementById('quiz-footer');
    if (!footer) return;
    footer.innerHTML = '';
    const q = quizState.questions[quizState.index];
    
    // V10.3: 解析可折叠展示
    if (q && q.explanation) {
        const expToggle = document.createElement('div');
        expToggle.style.cssText = 'text-align:center;margin:8px 0';
        expToggle.innerHTML = '<button id="exp-toggle-btn" style="background:rgba(255,217,61,0.12);border:1px solid rgba(255,217,61,0.3);color:#d4a017;padding:6px 16px;border-radius:10px;font-size:0.85rem;cursor:pointer;transition:all 0.3s">💡 点击查看解析</button>';
        footer.appendChild(expToggle);
        const expDiv = document.createElement('div');
        expDiv.id = 'explanation-content';
        expDiv.style.cssText = 'color:#ffd93d;margin:10px 0 4px;font-size:0.92rem;text-align:center;line-height:1.6;padding:12px 14px;background:rgba(255,217,61,0.06);border-radius:12px;display:none';
        expDiv.textContent = q.explanation;
        footer.appendChild(expDiv);
        const toggleBtn = expToggle.querySelector('#exp-toggle-btn');
        toggleBtn.onclick = function() {
            const content = document.getElementById('explanation-content');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                toggleBtn.textContent = '💡 收起解析';
            } else {
                content.style.display = 'none';
                toggleBtn.textContent = '💡 点击查看解析';
            }
        };
    }
    
    // V10.3: 显示本题用时
    const timeInfo = document.createElement('div');
    timeInfo.style.cssText = 'text-align:center;color:var(--text-muted);font-size:0.8rem;margin:6px 0';
    let timeStr = '本题用时 ' + qTime + ' 秒';
    if (qTime >= 60) timeStr = '本题用时 ' + Math.floor(qTime / 60) + '分' + (qTime % 60) + '秒';
    if (qTime < 10) timeStr += ' ⚡ 神速！';
    else if (qTime > 60) timeStr += ' 🐢 需提速';
    timeInfo.textContent = timeStr;

    const btn = document.createElement('button');

    btn.onclick = function() { nextQuestion(); };

}

function nextQuestion() {
    quizState.index++;
    if (quizState.index < quizState.questions.length) {
        renderQuiz();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    const { subject, level, correct, startTime } = quizState;
    const total = quizState.questions.length;
    let stars = 0;
    if (correct >= total * 0.9) stars = 3;
    else if (correct >= total * 0.7) stars = 2;
    else if (correct >= total * 0.5) stars = 1;
    else stars = 0;

    // XP奖励
    progress.xp += correct * 10;
    if (stars === 3 && !quizState.isWrongPractice) {
        progress.diamonds += 5;
    }
    // 通关XP奖励
    if (!quizState.isWrongPractice) {
        progress.xp += 50;
    }
    calculateLevel();

    const studyTime = Math.round((Date.now() - startTime) / 1000);
    progress.studyTime += studyTime;
    const today = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;
    progress.dailyTimes[today] += studyTime;

    if (!quizState.isWrongPractice && !quizState.isDaily) {
        const lv = progress.subjects[subject].levels[level];
        if (stars > lv.stars) lv.stars = stars;
        if (stars > 0) lv.completed = true;
    }

    if (quizState.isWrongPractice) {
        // V10.3: 智能复习 - 答对的题更新复习状态而非直接移除
        quizState.questions.forEach((q, idx) => {
            if (quizState.answers[idx]) {
                const wrongList = progress.wrongBook[subject];
                const foundIndex = wrongList.findIndex(w => w.question === q.q && w.answer === q.a);
                if (foundIndex >= 0) {
                    const item = wrongList[foundIndex];
                    const reviewCount = (item.reviewCount || 0) + 1;
                    // 复习5次以上则移除（已掌握）
                    if (reviewCount >= 6) {
                        wrongList.splice(foundIndex, 1);
                    } else {
                        item.reviewCount = reviewCount;
                        item.nextReviewTime = calculateNextReview(reviewCount);
                    }
                }
            }
        });
    }

    checkAchievements();

    // V9: 更新每日学习目标
    const todayKey = new Date().toISOString().slice(0, 10);
    if (!progress.dailyGoalDate || progress.dailyGoalDate !== todayKey) {
        progress.dailyGoalDate = todayKey;
        progress.dailyGoalProgress = 0;
    }
    progress.dailyGoalProgress = (progress.dailyGoalProgress || 0) + total;

    // V9: 更新学习日历
    if (!progress.studyCalendar) progress.studyCalendar = {};
    progress.studyCalendar[todayKey] = (progress.studyCalendar[todayKey] || 0) + total;

    // V9: 更新正确率历史
    if (!progress.accuracyHistory) progress.accuracyHistory = [];
    const acc = total > 0 ? Math.round(correct / total * 100) : 0;
    progress.accuracyHistory.push({ date: todayKey, subject: subject, accuracy: acc, total: total });
    if (progress.accuracyHistory.length > 30) progress.accuracyHistory.shift();

    // V9: 更新学科掌握度
    if (!progress.subjectMastery) progress.subjectMastery = { chinese: 0, math: 0, english: 0 };
    const subjectTotal = Q[currentGrade][subject].length;
    let completedLevels = 0;
    let totalStars = 0;
    for (const lv of progress.subjects[subject].levels) {
        if (lv.completed) { completedLevels++; totalStars += lv.stars; }
    }
    const maxStars = subjectTotal * 3;
    progress.subjectMastery[subject] = maxStars > 0 ? Math.round(totalStars / maxStars * 100) : 0;

    // 每日挑战奖励逻辑
    if (quizState && quizState.isDaily) {
        const todayKey = 'dailyDone_' + quizState.dailyDate;
        progress[todayKey] = true;
        const dayIdx = new Date().getDay();
        progress.dailyTimes[dayIdx] = (progress.dailyTimes[dayIdx] || 0) + 1;
        progress.diamonds += 3;
        // 检查连续打卡
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayKey = 'dailyDone_' + yesterday.toISOString().slice(0, 10);
        if (progress[yesterdayKey]) {
            progress.dailyStreak = (progress.dailyStreak || 0) + 1;
        } else {
            progress.dailyStreak = 1;
        }
    }

    saveUserProgress();
    clearSavedQuiz();
    // V10.3: 清理计时器
    if (quizState && quizState._timerInterval) { clearInterval(quizState._timerInterval); quizState._timerInterval = null; }
    const timerEl = document.getElementById('quiz-timer');
    if (timerEl) timerEl.style.display = 'none';
    document.getElementById('quiz-modal').classList.remove('active');
    updateDailyGoal();

    const starsDiv = document.getElementById('result-stars');
    starsDiv.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const s = document.createElement('div');
        s.className = 'result-star';
        if (i < stars) s.classList.add('earned');
        s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
        starsDiv.appendChild(s);
    }
    const msg = document.getElementById('result-message');
    if (stars === 3) {
        msg.textContent = '太厉害了！完美通关！';
        createRewardParticles(50);
        showFireworks();
    }
    else if (stars === 2) msg.textContent = '真棒！再加油！';
    else if (stars === 1) msg.textContent = '不错哦！继续努力！';
    else msg.textContent = '别灰心，再试一次吧！';

    // V10.3: 详细答题分析
    const analyticsEl = document.getElementById('result-analytics');
    if (analyticsEl) {
        const times = quizState.questionTimes || [];
        const totalTime = times.reduce((s, t) => s + t, 0);
        const avgTime = times.length > 0 ? Math.round(totalTime / times.length) : 0;
        const fastestTime = times.length > 0 ? Math.min(...times) : 0;
        const slowestTime = times.length > 0 ? Math.max(...times) : 0;

        // 按题型统计正确率
        const typeStats = {};
        quizState.questions.forEach((q, i) => {
            const type = q.t || 'choice';
            if (!typeStats[type]) typeStats[type] = { correct: 0, total: 0 };
            typeStats[type].total++;
            if (quizState.answers[i]) typeStats[type].correct++;
        });
        const typeNames = { choice: '选择题', fill: '填空题', match: '连线配对', listen: '听音选词', tf: '判断对错', order: '排序题' };

        let analyticsHTML = '<div style="background:rgba(255,255,255,0.5);border-radius:16px;padding:14px 16px;margin-top:8px">';
        
        // 核心数据
        analyticsHTML += '<div style="display:flex;justify-content:space-around;text-align:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">';
        analyticsHTML += '<div><div style="font-size:1.6rem;font-weight:700;color:var(--accent-orange);font-family:var(--font-number)">' + correct + '/' + total + '</div><div style="font-size:0.75rem;color:var(--text-secondary)">正确题数</div></div>';
        analyticsHTML += '<div><div style="font-size:1.6rem;font-weight:700;color:var(--accent-blue);font-family:var(--font-number)">' + Math.round(correct / total * 100) + '%</div><div style="font-size:0.75rem;color:var(--text-secondary)">正确率</div></div>';
        analyticsHTML += '<div><div style="font-size:1.6rem;font-weight:700;color:var(--accent-green);font-family:var(--font-number)">' + avgTime + 's</div><div style="font-size:0.75rem;color:var(--text-secondary)">平均用时</div></div>';
        analyticsHTML += '</div>';

        // 按题型分析
        if (Object.keys(typeStats).length > 1) {
            analyticsHTML += '<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:10px;margin-top:4px">';
            analyticsHTML += '<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:6px">📊 题型分析</div>';
            for (const [type, stats] of Object.entries(typeStats)) {
                const rate = stats.total > 0 ? Math.round(stats.correct / stats.total * 100) : 0;
                const barColor = rate >= 80 ? 'var(--accent-green)' : rate >= 50 ? 'var(--accent-orange)' : 'var(--accent-red)';
                analyticsHTML += '<div style="display:flex;align-items:center;gap:8px;margin:4px 0">';
                analyticsHTML += '<span style="font-size:0.78rem;color:var(--text-secondary);width:60px;flex-shrink:0">' + (typeNames[type] || type) + '</span>';
                analyticsHTML += '<div style="flex:1;height:8px;background:rgba(0,0,0,0.05);border-radius:4px;overflow:hidden"><div style="width:' + rate + '%;height:100%;background:' + barColor + ';border-radius:4px;transition:width 0.5s"></div></div>';
                analyticsHTML += '<span style="font-size:0.78rem;color:var(--text-primary);width:70px;text-align:right;flex-shrink:0">' + stats.correct + '/' + stats.total + ' (' + rate + '%)</span>';
                analyticsHTML += '</div>';
            }
            analyticsHTML += '</div>';
        }

        // 用时分析
        if (times.length > 0) {
            analyticsHTML += '<div style="border-top:1px solid rgba(0,0,0,0.06);padding-top:10px;margin-top:8px">';
            analyticsHTML += '<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:6px">⏱ 用时分析</div>';
            analyticsHTML += '<div style="display:flex;justify-content:space-around;text-align:center;font-size:0.8rem">';
            analyticsHTML += '<div><span style="color:var(--text-muted)">最快</span> <span style="color:var(--accent-green);font-weight:600">' + fastestTime + 's</span></div>';
            analyticsHTML += '<div><span style="color:var(--text-muted)">最慢</span> <span style="color:var(--accent-red);font-weight:600">' + slowestTime + 's</span></div>';
            analyticsHTML += '<div><span style="color:var(--text-muted)">总计</span> <span style="color:var(--accent-blue);font-weight:600">' + totalTime + 's</span></div>';
            analyticsHTML += '</div>';
            // 用时趋势 mini chart
            if (times.length > 1) {
                const maxT = Math.max(...times, 1);
                analyticsHTML += '<div style="display:flex;align-items:flex-end;gap:2px;height:32px;margin-top:8px">';
                times.forEach((t, i) => {
                    const h = Math.max(4, Math.round(t / maxT * 32));
                    const isCorrect = quizState.answers[i];
                    const color = isCorrect ? 'var(--accent-green)' : 'var(--accent-red)';
                    analyticsHTML += '<div style="flex:1;height:' + h + 'px;background:' + color + ';border-radius:2px;opacity:0.7;min-width:4px" title="第' + (i+1) + '题: ' + t + 's"></div>';
                });
                analyticsHTML += '</div>';
                analyticsHTML += '<div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--text-muted);margin-top:2px"><span>第1题</span><span>用时趋势</span><span>第' + times.length + '题</span></div>';
            }
            analyticsHTML += '</div>';
        }

        // 学习建议
        const weakTypes = Object.entries(typeStats).filter(([_, s]) => s.total > 0 && s.correct / s.total < 0.5).map(([t]) => typeNames[t] || t);
        if (weakTypes.length > 0) {
            analyticsHTML += '<div style="background:rgba(232,139,139,0.08);border-radius:10px;padding:10px 12px;margin-top:8px;border:1px solid rgba(232,139,139,0.15)">';
            analyticsHTML += '<div style="font-size:0.8rem;color:var(--accent-red)">📌 建议：加强「' + weakTypes.join('、') + '」题型练习</div>';
            analyticsHTML += '</div>';
        }
        if (avgTime > 45) {
            analyticsHTML += '<div style="background:rgba(255,140,66,0.08);border-radius:10px;padding:10px 12px;margin-top:6px;border:1px solid rgba(255,140,66,0.15)">';
            analyticsHTML += '<div style="font-size:0.8rem;color:var(--accent-orange)">📌 建议：平均用时偏长，建议限时训练提高速度</div>';
            analyticsHTML += '</div>';
        }
        
        analyticsHTML += '</div>';
        analyticsEl.innerHTML = analyticsHTML;
    }

    const footer = document.getElementById('result-buttons');
    if (quizState.isDaily) {
        footer.innerHTML = '<button class="close-btn" onclick="closeResult()">返回</button>';
    } else {
        const isLastLevel = quizState.isWrongPractice ? false : level === (Q[currentGrade][subject].length - 1);
        if (stars > 0 && !isLastLevel && !quizState.isWrongPractice) {
            footer.innerHTML = '<button class="next-btn" onclick="nextLevel()">下一关</button><button class="retry-btn" onclick="retryLevel()">再试一次</button>';
        } else if (stars > 0 && isLastLevel && !quizState.isWrongPractice) {
            footer.innerHTML = '<button class="close-btn" onclick="closeResult()">完成</button><button class="retry-btn" onclick="retryLevel()">再试一次</button>';
        } else {
            footer.innerHTML = '<button class="retry-btn" onclick="retryLevel()">再试一次</button><button class="close-btn" onclick="closeResult()">返回</button>';
        }
    }
    document.getElementById('result-modal').classList.add('active');
}

function nextLevel() {
    document.getElementById('result-modal').classList.remove('active');
    const nextLv = quizState.level + 1;
    if (nextLv < Q[currentGrade][quizState.subject].length) {
        startQuiz(quizState.subject, nextLv);
    } else {
        closeResult();
    }
}

function retryLevel() {
    document.getElementById('result-modal').classList.remove('active');
    if (quizState.isWrongPractice) {
        startQuizFromList(quizState.subject, progress.wrongBook[quizState.subject]);
    } else {
        startQuiz(quizState.subject, quizState.level);
    }
}

function closeResult() {
    document.getElementById('result-modal').classList.remove('active');
    if (quizState.isWrongPractice) {
        showPage('page-wrongbook');
    } else {
        goSubject(quizState.subject, quizState.level);
    }
}

function showReward(text) {
    const overlay = document.getElementById('reward-overlay');
    document.getElementById('reward-text').textContent = text;
    overlay.classList.add('active');
    setTimeout(() => {
        overlay.classList.remove('active');
    }, 1000);

            </div>

function renderCalendarHeatmap() {
    const calendar = progress.studyCalendar || {};
    const today = new Date();
    const weeks = 8; // 显示8周
    const days = weeks * 7;
    const startDate = new Date(today);
    startDate.setDate(startDate.getDate() - days + 1);

    // V10.3: 计算学习统计
    let totalStudyDays = 0;
    let totalQuestions = 0;
    let currentStreak = 0;
    let bestStreak = 0;
    let tempStreak = 0;

    // 计算连续学习天数
    const checkDate = new Date(today);
    for (let i = 0; i < 365; i++) {
        const d = new Date(checkDate);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        if (calendar[key] && calendar[key] > 0) {
            if (i === 0 || currentStreak > 0) currentStreak++;
            tempStreak++;
            if (tempStreak > bestStreak) bestStreak = tempStreak;
        } else {
            if (i > 0) {
                currentStreak = 0;
                tempStreak = 0;
            }
        }
    }

    // 统计总学习天数和总题数
    for (const [date, count] of Object.entries(calendar)) {
        if (count > 0) {
            totalStudyDays++;
            totalQuestions += count;
        }
    }

    let cells = '';
    let weekDayLabels = ['一', '', '三', '', '五', '', '日'];
    let labelsHTML = weekDayLabels.map(l => `<div style="font-size:0.6rem;color:var(--text-muted);height:12px;line-height:12px;text-align:center">${l}</div>`).join('');
    
    // 计算本月学习统计
    const thisMonth = today.getMonth();
    const thisYear = today.getFullYear();
    let monthCount = 0;
    let monthDays = 0;
    for (const [date, count] of Object.entries(calendar)) {
        const d = new Date(date);
        if (d.getMonth() === thisMonth && d.getFullYear() === thisYear && count > 0) {
            monthCount += count;
            monthDays++;
        }
    }

    for (let i = 0; i < days; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        const key = d.toISOString().slice(0, 10);
        const count = calendar[key] || 0;
        let level = 0;
        if (count >= 20) level = 4;
        else if (count >= 10) level = 3;
        else if (count >= 5) level = 2;
        else if (count > 0) level = 1;

        const isToday = key === today.toISOString().slice(0, 10);
        const todayClass = isToday ? 'ring:2px;ring-color:var(--accent-orange);box-shadow:0 0 0 2px var(--accent-orange)' : '';
        
        cells += `<div class="calendar-cell ${level > 0 ? 'level-' + level : ''}" style="${isToday ? 'box-shadow:0 0 0 2px var(--accent-orange);z-index:1' : ''}" title="${key}: ${count}题"></div>`;
    }

    return `
        <div class="chart-card">
            <div class="chart-title">📅 学习日历（最近${weeks}周）</div>
            
            <!-- V10.3: 连续打卡统计 -->

                    <div style="font-size:0.7rem;color:var(--text-secondary)">最长连续</div>
                </div>
                <div>
                    <div style="font-size:1.4rem;font-weight:700;color:var(--accent-green);font-family:var(--font-number)">${totalStudyDays}</div>
                    <div style="font-size:0.7rem;color:var(--text-secondary)">总学习天数</div>

                <div>

function updateDailyGoal() {
    const bar = document.getElementById('daily-goal-bar');
    const text = document.getElementById('daily-goal-text');
    const status = document.getElementById('daily-goal-status');
    if (!bar || !text || !status) return;

    const todayKey = new Date().toISOString().slice(0, 10);
    if (!progress.dailyGoalDate || progress.dailyGoalDate !== todayKey) {
        progress.dailyGoalDate = todayKey;
        progress.dailyGoalProgress = 0;
    }

    const goal = progress.dailyGoal || 10;
    const done = progress.dailyGoalProgress || 0;
    const pct = Math.min(100, Math.round(done / goal * 100));

    bar.style.width = pct + '%';
    text.textContent = `完成 ${done}/${goal} 题`;

    if (done >= goal) {
        status.textContent = '✓ 今日目标已完成！';
        status.className = 'daily-goal-complete';
    } else {
        status.textContent = `还差 ${goal - done} 题`;
        status.className = '';
    }
}

function checkAchievements() {

    const check = (id) => {

            progress.achievements.push(id);
            const ach = ACHIEVEMENTS.find(a => a.id === id);
            createRewardParticles(20, '#FFD700');
            showAchievementToast(ach);
        }
    };

    if (progress.correctAnswers >= 1) check('one_question');
    if (progress.correctAnswers >= 100) check('hundred_questions');
    if (progress.correctAnswers >= 1000) check('thousand_questions');
    if (progress.dailyStreak >= 7) check('seven_days');
    if (progress.dailyStreak >= 30) check('thirty_days');
    if (progress.totalStars >= 100) check('hundred_stars');
    if (progress.totalStars >= 500) check('five_hundred_stars');

    let allChinese3 = true;
    let allMath3 = true;
    let allEnglish3 = true;
    let allCompleted = true;
    for (let i = 0; i < 20; i++) {
        if (progress.subjects.chinese.levels[i].stars < 3) allChinese3 = false;
        if (progress.subjects.math.levels[i].stars < 3) allMath3 = false;
        if (progress.subjects.english.levels[i].stars < 3) allEnglish3 = false;
        if (!progress.subjects.chinese.levels[i].completed || !progress.subjects.math.levels[i].completed || !progress.subjects.english.levels[i].completed) {
            allCompleted = false;
        }
    }
    if (allChinese3) check('all_chinese');
    if (allMath3) check('all_math');
    if (allEnglish3) check('all_english');
    if (allCompleted) check('all_subjects');
}

}

function clearSavedQuiz() {
    if (!currentUser) return;

function restoreSavedQuiz() {
    if (!currentUser) return;
    const saved = localStorage.getItem('starAcademy_savedQuiz_' + currentUser);
    if (!saved) return;
    try {
        const data = JSON.parse(saved);
        quizState = {
            questions: data.questions,
            index: data.index,
            score: 0,
            combo: 0,
            maxCombo: 0,
            correct: data.correct,
            answers: data.answers,
            startTime: data.startTime,
            matchState: null,
            isWrongPractice: data.isWrongPractice,
            isDaily: data.isDaily,
            dailyDate: data.dailyDate,
            subject: data.subject,
            level: data.level
        };
        const title = data.isDaily ? '每日挑战（恢复）' : '关卡挑战（恢复）';
        document.getElementById('quiz-title').textContent = title;
        document.getElementById('quiz-modal').classList.add('active');

function startDailyChallenge() {
    // 检查今日是否已完成
    const today = new Date().toISOString().slice(0, 10);
    if (!progress.dailyTimes) progress.dailyTimes = [0,0,0,0,0,0,0];
    const dayIdx = new Date().getDay();
    const todayKey = 'dailyDone_' + today;
    if (progress[todayKey]) {
        alert('今日挑战已完成，明天再来吧！');
        return;
    }
    // 从三科中随机各抽3题，共9题
    const allQuestions = [];
    const subjects = ['chinese', 'math', 'english'];
    subjects.forEach(sub => {
        const levels = Q[currentGrade][sub];
        // 从每个科目随机选3个关卡
        const shuffledLevels = levels.slice().sort(() => Math.random() - 0.5);
        const picked = shuffledLevels.slice(0, 3);
        picked.forEach(level => {
            const qs = level.qs.slice().sort(() => Math.random() - 0.5);
            allQuestions.push({ ...qs[0], _subject: sub, _levelName: level.name });
        });
    });
    // 打乱顺序
    allQuestions.sort(() => Math.random() - 0.5);
    // 开始答题
    quizState = {
        questions: allQuestions,
        index: 0,
        score: 0,
        combo: 0,
        maxCombo: 0,
        correct: 0,
        answers: [],
        startTime: Date.now(),
        matchState: null,
        isWrongPractice: false,
        isDaily: true,
        dailyDate: today,
        questionTimes: [],
        questionStartTime: Date.now()
    };
    document.getElementById('quiz-title').textContent = '每日挑战';
    document.getElementById('quiz-modal').classList.add('active');
    renderQuiz();
}

// 简易音效
function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'correct') {
            osc.frequency.setValueAtTime(523, ctx.currentTime);
            osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'combo') {
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.5);
        }
    } catch(e) {}
}

// ==================== 管理员功能 ====================
let isAdmin = false;

// 只有管理员才能访问管理面板
let adminPanelCached = false;
async function showAdminPanel() {
    if (currentUser !== 'admin' || !isAdmin) {
        isAdmin = false;
        return;
    }
    document.getElementById('welcome-username').textContent = '管理员';
    document.getElementById('user-avatar').textContent = 'A';
    const dailyBanner = document.querySelector('.daily-banner');
    if (dailyBanner) dailyBanner.style.display = 'none';
    document.getElementById('subject-tabs').style.display = 'none';
    document.getElementById('home-level-grid').innerHTML = '';
    document.getElementById('home-level-grid').style.display = 'none';
    
    let adminDiv = document.getElementById('admin-panel');
    if (!adminDiv) {
        adminDiv = document.createElement('div');
        adminDiv.id = 'admin-panel';
        document.getElementById('page-home').appendChild(adminDiv);
    }
    
    // 仅在首次加载或未禁用云端时显示同步提示
    if (!ghDisabled && !adminPanelCached) {
        adminDiv.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary)">正在从云端同步数据...</div>';
    }
    
    let cloudUsers = {};
    let cloudProgress = {};
    try {
        const cloud = await ghRead();
        if (cloud && cloud.data.users) {
            cloudUsers = cloud.data.users;
            cloudProgress = cloud.data.progress || {};
            adminPanelCached = true;
        }
    } catch(e) {}
    
    // 合并本地数据
    const usersKey = 'starAcademyUsers';
    let localUsers = {};
    try { localUsers = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
    const merged = { ...cloudUsers, ...localUsers };
    const mergedProgress = { ...cloudProgress };
    for (const u of Object.keys(localUsers)) {
        if (u === 'admin') continue;
        const p = localStorage.getItem('starAcademy_' + u);
        if (p) mergedProgress[u] = JSON.parse(p);
    }
    
    const userList = Object.keys(merged).filter(u => u !== 'admin');
    
    let html = '<div style="padding:20px">';
    html += '<h3 style="color:var(--gold);margin-bottom:4px">用户管理</h3>';
    html += '<p style="color:var(--text-secondary);margin-bottom:8px;font-size:0.8rem">云端 + 本地数据</p>';
    html += '<p style="color:var(--text-secondary);margin-bottom:16px">共 ' + userList.length + ' 个注册用户</p>';
    
    if (userList.length === 0) {
        html += '<p style="color:var(--text-secondary)">暂无其他用户</p>';
    } else {
        html += '<div style="display:flex;flex-direction:column;gap:10px">';
        userList.forEach(u => {
            let info = '暂无进度';
            try {
                const p = mergedProgress[u] || JSON.parse(localStorage.getItem('starAcademy_' + u) || '{}');
                if (p && p.questionsAnswered !== undefined) {
                    info = '答题' + p.questionsAnswered + '题 · ' + (p.totalStars || 0) + '星 · Lv.' + (p.level || 1);
                }
            } catch(e) {}
            
            const isUnlocked = mergedProgress[u] && mergedProgress[u].antiAddiction && mergedProgress[u].antiAddiction.unlocked;
            html += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-blur);backdrop-filter:blur(40px);border:1px solid var(--border-blur);border-radius:16px;padding:14px 18px">';
            html += '<div><div style="font-weight:600;color:var(--text-primary)">' + u + (isUnlocked ? ' <span style="color:var(--accent-green);font-size:0.75rem">[已解限]</span>' : '') + '</div><div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px">' + info + '</div></div>';
            html += '<div style="display:flex;gap:8px">';
            html += '<button onclick="unlockUserAntiAddiction(\'' + u + '\')" style="background:rgba(125,196,165,0.15);border:1px solid rgba(125,196,165,0.3);color:#4ecdc4;padding:6px 14px;border-radius:10px;cursor:pointer;font-size:0.85rem;transition:all 0.3s" onmouseover="this.style.background=\'rgba(125,196,165,0.3)\'" onmouseout="this.style.background=\'rgba(125,196,165,0.15)\'">' + (isUnlocked ? '恢复限制' : '解除限制') + '</button>';
            html += '<button onclick="deleteUser(\'' + u + '\')" style="background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;padding:6px 14px;border-radius:10px;cursor:pointer;font-size:0.85rem;transition:all 0.3s" onmouseover="this.style.background=\'rgba(255,80,80,0.3)\'" onmouseout="this.style.background=\'rgba(255,80,80,0.15)\'">删除</button>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
    }
    
    html += '<button onclick="clearAllTrashUsers()" style="margin-top:20px;background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);color:#ff6b6b;padding:12px 24px;border-radius:16px;cursor:pointer;font-size:0.9rem;width:100%;transition:all 0.3s" onmouseover="this.style.background=\'rgba(255,80,80,0.2)\'" onmouseout="this.style.background=\'rgba(255,80,80,0.1)\'">清除无进度垃圾账号</button>';
    html += '</div>';
    
    adminDiv.innerHTML = html;
}

async function deleteUser(username) {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    showDeleteConfirmModal(username);
}

function showDeleteConfirmModal(username) {
    const existing = document.getElementById('delete-confirm-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'delete-confirm-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML = `
        <div style="background:linear-gradient(135deg,#FFF8F0,#F0F8FF);border-radius:24px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
            <div style="font-size:2.5rem;margin-bottom:8px">&#9888;&#65039;</div>
            <h3 style="margin:0 0 4px;color:var(--text-primary);font-size:1.1rem">确认删除</h3>
            <p style="color:var(--text-secondary);margin:0 0 20px;font-size:0.9rem">确定要删除用户 "${username}" 吗？该用户的所有数据将被清除。此操作不可撤销。</p>
            <div style="display:flex;flex-direction:column;gap:10px">
                <button id="delete-confirm-btn" style="background:rgba(255,80,80,0.9);color:#fff;border:none;padding:14px;border-radius:14px;font-size:1rem;cursor:pointer;width:100%">确认删除</button>
                <button id="delete-cancel-btn" style="background:transparent;border:none;color:var(--text-secondary);padding:10px;font-size:0.95rem;cursor:pointer">取消</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('delete-cancel-btn').onclick = () => modal.remove();
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    document.getElementById('delete-confirm-btn').onclick = async () => {
        modal.remove();
        const usersKey = 'starAcademyUsers';
        let users = {};
        try { users = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
        delete users[username];
        localStorage.setItem(usersKey, JSON.stringify(users));
        localStorage.removeItem('starAcademy_' + username);
        if (localStorage.getItem('starAcademyCurrentUser') === username) {
            localStorage.removeItem('starAcademyCurrentUser');
        }
        try {
            const cloud = await ghRead();
            if (cloud) {
                if (cloud.data.users) delete cloud.data.users[username];
                if (cloud.data.progress) delete cloud.data.progress[username];
                await ghWrite(cloud.data, cloud.sha, 'Delete user ' + username);
            }
        } catch(e) {}
        showAdminPanel();
    };
}

async function clearAllTrashUsers() {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    const usersKey = 'starAcademyUsers';
    let users = {};
    try { users = JSON.parse(localStorage.getItem(usersKey) || '{}'); } catch(e) {}
    const allUsers = Object.keys(users).filter(u => u !== 'admin');
    let trashCount = 0;
    allUsers.forEach(u => {
        try {
            const p = JSON.parse(localStorage.getItem('starAcademy_' + u) || '{}');
            if (!p.questionsAnswered || p.questionsAnswered === 0) {
                trashCount++;
                delete users[u];
                localStorage.removeItem('starAcademy_' + u);
            }
        } catch(e) {
            trashCount++;
            delete users[u];
            localStorage.removeItem('starAcademy_' + u);
        }
    });
    localStorage.setItem(usersKey, JSON.stringify(users));
    // 云端同步删除
    try {
        const cloud = await ghRead();
        if (cloud) {
            for (const u of allUsers) {
                const p = localStorage.getItem('starAcademy_' + u);
                if (!p) {
                    if (cloud.data.users) delete cloud.data.users[u];
                    if (cloud.data.progress) delete cloud.data.progress[u];
                }
            }
            await ghWrite(cloud.data, cloud.sha, 'Clear trash users');
        }
    } catch(e) {}
    alert('已清除 ' + trashCount + ' 个无进度账号');
    showAdminPanel();
}

async function unlockUserAntiAddiction(username) {
    // 管理员权限检查
    if (!isAdmin || currentUser !== 'admin') {
        alert('仅管理员可以操作');
        return;
    }
    let targetProgress = null;
    try {
        const p = localStorage.getItem('starAcademy_' + username);
        if (p) targetProgress = JSON.parse(p);
    } catch(e) {}

    // 本地修改
    if (targetProgress) {
        if (!targetProgress.antiAddiction) {
            targetProgress.antiAddiction = {
                todayDate: '',
                todayTotalSeconds: 0,
                devices: {},
                unlocked: false,
                _lastTick: 0
            };
        }
        targetProgress.antiAddiction.unlocked = !targetProgress.antiAddiction.unlocked;
        localStorage.setItem('starAcademy_' + username, JSON.stringify(targetProgress));
    }

    // 云端同步
    try {
        const cloud = await ghRead();
        if (cloud && cloud.data.progress && cloud.data.progress[username]) {
            const cp = cloud.data.progress[username];
            if (!cp.antiAddiction) {
                cp.antiAddiction = {
                    todayDate: '',
                    todayTotalSeconds: 0,
                    devices: {},
                    unlocked: false,
                    _lastTick: 0
                };
            }
            cp.antiAddiction.unlocked = targetProgress ? targetProgress.antiAddiction.unlocked : true;
            await ghWrite(cloud.data, cloud.sha, 'Toggle anti-addiction for ' + username);
        }
    } catch(e) {}

    const action = targetProgress && targetProgress.antiAddiction && targetProgress.antiAddiction.unlocked ? '解除' : '恢复';
    alert('已' + action + '用户 "' + username + '" 的防沉迷限制');
    showAdminPanel();
}
</script>


<!-- PWA 安装横幅 -->
<div class="pwa-install-banner" id="pwa-install-banner">
    <div class="pwa-install-icon">🚀</div>
    <div class="pwa-install-text">
        <div class="pwa-install-title">安装到桌面</div>
