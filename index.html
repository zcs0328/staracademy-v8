<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF8C42">
    <meta name="description" content="1-12年级（含高中）语数英智能学习平台，含题库、错题本、学习统计、智能复习系统、答题分析">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="星际学堂">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>星际学堂 V10.3 - 智能学习平台（含高中）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 小米座舱 × 暖橙雾蓝 配色 */
            --bg-primary: #FFF8F0;
            --bg-secondary: #F0F4F8;
            --bg-warm: #FFF0E0;
            --bg-cool: #E8F0F8;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-strong: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
            --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.06);
            --glass-blur: rgba(255, 255, 255, 0.65);
            --border-blur: rgba(255, 255, 255, 0.5);
            
            --text-primary: #2D2A26;
            --text-secondary: #8A8580;
            --text-muted: #B5AFA8;
            --text-tertiary: #8A8580;
            
            --accent-orange: #FF8C42;
            --accent-orange-light: #FFB380;
            --accent-orange-bg: rgba(255, 140, 66, 0.12);
            --accent-blue: #6BA3D6;
            --accent-blue-light: #A8CCE8;
            --accent-blue-bg: rgba(107, 163, 214, 0.12);
            --accent-green: #7DC4A5;
            --accent-red: #E88B8B;
            --gold: #FF9F43;
            --gold-bg: rgba(255, 159, 67, 0.15);
            
            --chinese: #FF8C42;
            --chinese-light: #FFB380;
            --chinese-bg: rgba(255, 140, 66, 0.12);
            --chinese-color: #FF8C42;
            --math: #6BA3D6;
            --math-light: #A8CCE8;
            --math-bg: rgba(107, 163, 214, 0.12);
            --math-color: #6BA3D6;
            --english: #7DC4A5;
            --english-light: #A8D8BE;
            --english-bg: rgba(125, 196, 165, 0.12);
            --english-color: #7DC4A5;
            
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 36px;
            
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 12px 48px rgba(0, 0, 0, 0.08);
            
            --font-main: -apple-system, 'MiSans', 'PingFang SC', 'Helvetica Neue', sans-serif;
            --font-number: 'DIN Alternate', 'MiSans', -apple-system, sans-serif;
            
            --bg-blur: rgba(255, 255, 255, 0.55);
        }




        /* ========== V9 排序题型 ========== */
        .order-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        
        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-md);
            cursor: grab;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        
        .order-item:active {
            cursor: grabbing;
        }
        
        .order-item.dragging {
            opacity: 0.5;
            transform: scale(0.97);
        }
        
        .order-item.drag-over {
            border-color: var(--accent-orange);
            transform: translateY(2px);
        }
        
        .order-item.placed {
            border-color: var(--accent-green);
        }
        
        .order-item.placed.wrong {
            border-color: var(--accent-red);
        }
        
        .order-index {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-orange-bg);
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        
        .order-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        
        .order-handle {
            color: var(--text-muted);
            font-size: 1.2rem;
        }
        
        /* V9 答题动画增强 */
        .answer-btn {
            position: relative;
            overflow: hidden;
        }
        
        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }
        
        .answer-btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        /* V9 关卡卡片悬浮增强 */
        .level-card {
            position: relative;
            overflow: hidden;
        }
        
        .level-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .level-card:hover::after {
            left: 100%;
        }
        
        /* V9 页面切换动画 */
        .page.active {
            animation: v9PageEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes v9PageEnter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* V9 成就解锁弹窗 */
        .achievement-toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--accent-orange), var(--gold));
            color: white;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(255, 140, 66, 0.4);
            z-index: 10000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .achievement-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* V9 加载骨架屏 */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-warm) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s infinite;
            border-radius: 8px;
        }
        
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }



        /* ========== V9 PWA 安装提示 ========== */
        .pwa-install-banner {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            max-width: 420px;
            margin: 0 auto;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .pwa-install-banner.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .pwa-install-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-orange), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        
        .pwa-install-text {
            flex: 1;
            min-width: 0;
        }
        
        .pwa-install-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .pwa-install-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        .pwa-install-btn {
            background: linear-gradient(135deg, var(--accent-orange), var(--gold));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .pwa-install-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(255, 140, 66, 0.4);
        }
        
        .pwa-install-btn:active {
            transform: scale(0.95);
        }
        
        .pwa-install-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            flex-shrink: 0;
        }
        
        .pwa-install-close:hover {
            color: var(--text-primary);
        }
        
        /* PWA 启动画面 */
        .pwa-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, #FFF0E0 0%, #F8E8D0 25%, #E8F0F8 60%, #D8E8F4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 10001;
            opacity: 1;
            transition: opacity 0.5s;
        }
        
        .pwa-splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .pwa-splash-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FF8C42, #FFB380);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            animation: pwaSplashBounce 1.5s ease-in-out infinite;
        }
        
        @keyframes pwaSplashBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .pwa-splash-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .pwa-splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--accent-orange-bg);
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: pwaSpin 0.8s linear infinite;
        }
        
        @keyframes pwaSpin {
            to { transform: rotate(360deg); }
        }


        /* ========== V9 统计仪表盘 ========== */
        .stats-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stats-hero-card {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--glass-shadow);
            text-align: center;
        }
        
        .stats-hero-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .stats-hero-value {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: var(--font-number);
            background: linear-gradient(135deg, var(--accent-orange), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        
        .stats-hero-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-mini-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-mini-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-shadow-hover);
        }
        
        .stat-mini-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        
        .stat-mini-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-number);
            color: var(--text-primary);
        }
        
        .stat-mini-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        /* 正确率趋势图 */
        .chart-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .chart-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .accuracy-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 120px;
            padding-bottom: 24px;
            position: relative;
        }
        
        .accuracy-bar {
            flex: 1;
            min-width: 0;
            border-radius: 6px 6px 0 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            min-height: 4px;
        }
        
        .accuracy-bar:hover {
            filter: brightness(1.15);
            transform: scaleY(1.05);
            transform-origin: bottom;
        }
        
        .accuracy-bar::after {
            content: attr(data-value);
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        /* 知识点掌握度雷达 */
        .radar-container {
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        
        .radar-svg {
            max-width: 240px;
            height: auto;
        }
        
        /* 学习日历热力图 */
        .calendar-heatmap {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-top: 8px;
        }
        
        .calendar-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background: var(--bg-secondary);
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        
        .calendar-cell:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        
        .calendar-cell.level-1 { background: rgba(255, 140, 66, 0.2); }
        .calendar-cell.level-2 { background: rgba(255, 140, 66, 0.4); }
        .calendar-cell.level-3 { background: rgba(255, 140, 66, 0.6); }
        .calendar-cell.level-4 { background: rgba(255, 140, 66, 0.85); }
        
        .calendar-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: flex-end;
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .calendar-legend-cell {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        
        /* 每日目标卡片 */
        .daily-goal-card {
            background: linear-gradient(135deg, var(--accent-orange-bg), var(--gold-bg));
            border: 1px solid rgba(255, 140, 66, 0.2);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 0 20px 16px;
            animation: fadeSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s backwards;
        }
        
        .daily-goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .daily-goal-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .daily-goal-edit {
            font-size: 0.75rem;
            color: var(--accent-orange);
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            background: var(--accent-orange-bg);
            border: none;
            transition: all 0.2s;
        }
        
        .daily-goal-edit:hover {
            background: var(--accent-orange);
            color: white;
        }
        
        .daily-goal-progress {
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .daily-goal-bar {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--accent-orange), var(--gold));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .daily-goal-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .daily-goal-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .daily-goal-complete {
            color: var(--accent-green);
            font-weight: 600;
        }
        
        /* 学科掌握度条 */
        .mastery-bar-container {
            margin-bottom: 10px;
        }
        
        .mastery-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        
        .mastery-bar-label span:first-child {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .mastery-bar-label span:last-child {
            color: var(--text-secondary);
            font-family: var(--font-number);
        }
        
        .mastery-bar-track {
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .mastery-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        

        /* ========== V9 深色模式 ========== */
        body.dark-mode {
            --bg-primary: #1A1A2E;
            --bg-secondary: #16213E;
            --bg-warm: #1E1E3A;
            --bg-cool: #0F3460;
            --glass-bg: rgba(30, 30, 58, 0.65);
            --glass-bg-strong: rgba(30, 30, 58, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
            --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
            --glass-blur: rgba(30, 30, 58, 0.75);
            --border-blur: rgba(255, 255, 255, 0.06);
            
            --text-primary: #E8E8F0;
            --text-secondary: #A0A0B8;
            --text-muted: #6C6C80;
            --text-tertiary: #A0A0B8;
            
            --accent-orange: #FF9F55;
            --accent-orange-light: #FFB380;
            --accent-orange-bg: rgba(255, 159, 85, 0.15);
            --accent-blue: #7BB8E8;
            --accent-blue-light: #A8CCE8;
            --accent-blue-bg: rgba(123, 184, 232, 0.15);
            --accent-green: #8DD4B5;
            --accent-red: #E88B8B;
            --gold: #FFB555;
            --gold-bg: rgba(255, 181, 85, 0.18);
            
            --chinese: #FF9F55;
            --chinese-light: #FFB380;
            --chinese-bg: rgba(255, 159, 85, 0.15);
            --chinese-color: #FF9F55;
            --math: #7BB8E8;
            --math-light: #A8CCE8;
            --math-bg: rgba(123, 184, 232, 0.15);
            --math-color: #7BB8E8;
            --english: #8DD4B5;
            --english-light: #A8D8BE;
            --english-bg: rgba(141, 212, 181, 0.15);
            --english-color: #8DD4B5;
            
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.2);
            --shadow-float: 0 12px 48px rgba(0, 0, 0, 0.3);
            
            --bg-blur: rgba(30, 30, 58, 0.65);
        }
        
        body.dark-mode {
            background: linear-gradient(165deg, #1A1A2E 0%, #16213E 25%, #0F3460 60%, #1A1A3E 100%);
        }
        
        body.dark-mode::before {
            background: radial-gradient(ellipse, rgba(255, 159, 85, 0.12) 0%, transparent 70%);
        }
        
        body.dark-mode::after {
            background: radial-gradient(ellipse, rgba(123, 184, 232, 0.10) 0%, transparent 70%);
        }
        
        /* 深色模式适配 */
        body.dark-mode .welcome-card,
        body.dark-mode .dashboard-container,
        body.dark-mode .wrongbook-container,
        body.dark-mode .learn-card,
        body.dark-mode .modal-content,
        body.dark-mode .grade-chip,
        body.dark-mode .level-card,
        body.dark-mode .example-box,
        body.dark-mode .stat-card,
        body.dark-mode .daily-banner {
            background: var(--glass-bg) !important;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
        
        body.dark-mode .level-card .level-name {
            color: var(--text-primary);
        }
        
        body.dark-mode .quiz-option {
            background: rgba(30, 30, 58, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        body.dark-mode .quiz-option.selected {
            background: var(--accent-orange-bg);
            border-color: var(--accent-orange);
        }
        
        body.dark-mode input,
        body.dark-mode textarea {
            background: rgba(30, 30, 58, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        body.dark-mode .bottom-nav {
            background: rgba(15, 20, 40, 0.9);
            border-top-color: rgba(255, 255, 255, 0.08);
        }
        
        body.dark-mode .nav-item .nav-label {
            color: var(--text-secondary);
        }
        
        body.dark-mode .nav-item.active .nav-label {
            color: var(--accent-orange);
        }
        
        body.dark-mode .nav-item .nav-icon svg {
            fill: var(--text-secondary);
        }
        
        body.dark-mode .nav-item.active .nav-icon svg {
            fill: var(--accent-orange);
        }
        
        body.dark-mode #main-top-nav {
            background: rgba(15, 20, 40, 0.85);
            border-bottom-color: rgba(255, 255, 255, 0.08);
